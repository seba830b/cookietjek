<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf3e8">
<title>Lazy Prep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 14h26a13 13 0 0 1-26 0z' fill='%23c43a1c'/%3E%3Cpath d='M11 4c-2 2 2 4 0 7M17 3c-2 2 2 4 0 7M23 4c-2 2 2 4 0 7' stroke='%23f3b52f' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------- Tokens */
:root {
  --bg: #fbf3e8; --surface: #fffcf7; --surface-2: #f5eadb; --text: #2b1d13; --muted: #6f5a48; --border: #ead8c1;
  --accent: #c43a1c; --accent-ink: #ffffff; --accent-soft: #fde3d6;
  --mustard: #f3b52f; --mustard-soft: #fdefc6; --mustard-ink: #3a2900;
  --ok: #2f7d32; --ok-soft: #e1f0dc; --ok-ink: #ffffff;
  --shadow: 0 1px 0 rgb(90 45 10 / .05), 0 8px 20px -14px rgb(90 45 10 / .35);
  --mexican: #b4400f; --korean: #b0245a; --indian: #9a5500; --italian: #2f7a2f; --diner: #1d5fae; --takeaway: #6a3fd0;
  --pot: #1d5fae; --pan: #9a5500; --air: #c0282a; --you: #4f7a25;
  --hh: 132px; --navh: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16110d; --surface: #211913; --surface-2: #2c231b; --text: #f7ecdf; --muted: #bca794; --border: #3b2e23;
    --accent: #ff7f5e; --accent-ink: #2a0d04; --accent-soft: #3d1e12;
    --mustard: #f5c04a; --mustard-soft: #3b2e10; --mustard-ink: #2a1d00;
    --ok: #7fd481; --ok-soft: #183019; --ok-ink: #0c2410;
    --shadow: 0 1px 0 rgb(0 0 0 / .3);
    --mexican: #ff9a6b; --korean: #f57ba6; --indian: #ffb35c; --italian: #7fd481; --diner: #7cc4fa; --takeaway: #b9a2fd;
    --pot: #7cc4fa; --pan: #ffb35c; --air: #ff8f8a; --you: #b4e36a;
  }
}
:root[data-theme="dark"] {
  --bg: #16110d; --surface: #211913; --surface-2: #2c231b; --text: #f7ecdf; --muted: #bca794; --border: #3b2e23;
  --accent: #ff7f5e; --accent-ink: #2a0d04; --accent-soft: #3d1e12;
  --mustard: #f5c04a; --mustard-soft: #3b2e10; --mustard-ink: #2a1d00;
  --ok: #7fd481; --ok-soft: #183019; --ok-ink: #0c2410;
  --shadow: 0 1px 0 rgb(0 0 0 / .3);
  --mexican: #ff9a6b; --korean: #f57ba6; --indian: #ffb35c; --italian: #7fd481; --diner: #7cc4fa; --takeaway: #b9a2fd;
  --pot: #7cc4fa; --pan: #ffb35c; --air: #ff8f8a; --you: #b4e36a;
}

/* ---------- Base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--hh) + 12px); scroll-padding-bottom: calc(var(--navh) + 24px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}
.display { font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 10px; font-weight: 800; }
.skip:focus { top: 10px; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tnum { font-variant-numeric: tabular-nums; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Header (slides away on scroll down, back on scroll up) */
header.site { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); transition: transform .25s ease; }
.hdr-hidden header.site { transform: translateY(-100%); }
.top { display: flex; align-items: center; gap: 10px; padding-top: 10px; }
.logo { width: 40px; height: 40px; flex: none; }
.top .grow { flex: 1; min-width: 0; }
.top h1 { font-size: 1.4rem; line-height: 1.1; margin: 0; letter-spacing: -.02em; font-weight: 800; }
.top h1 span { color: var(--accent); }
.top p { margin: 1px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.25; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; height: 44px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: .8rem; font-weight: 700; }
.icon-btn svg.i { width: 18px; height: 18px; }
@media (max-width: 420px) { .icon-btn { padding: 0; } .icon-btn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }

.scale { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 14px; padding: 6px 0 8px; }
.scale label { display: flex; flex-direction: column; line-height: 1.15; min-width: 96px; }
.scale label small { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
.scale output b { display: block; font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scale output em { display: block; font-style: normal; font-size: .76rem; font-weight: 700; color: var(--accent); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; height: 44px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 99px;
  background: linear-gradient(to right, var(--accent) 0 var(--fill, 0%), var(--surface-2) var(--fill, 0%)); border: 1px solid var(--border); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); }
input[type=range]::-moz-range-progress { height: 10px; border-radius: 99px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%;
  background: var(--mustard); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border), 0 2px 6px rgb(0 0 0 / .25); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--mustard); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent); }
input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--accent); }

/* ---------- Tab bar: floating at the bottom */
nav.tabs { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: 10px;
  width: min(calc(100% - 20px), 520px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 5px;
  background: color-mix(in srgb, var(--surface) 94%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 10px 30px -12px rgb(0 0 0 / .4); }
nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 50px; min-width: 0;
  background: transparent; border: 0; border-radius: 17px; padding: 4px 2px; font-size: .72rem; font-weight: 700; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
nav.tabs button:not([aria-selected="true"]):hover { background: var(--surface-2); color: var(--text); }

main.wrap { padding-top: 16px; padding-bottom: calc(var(--navh) + 24px); }
section[hidden] { display: none !important; }
h2 { font-size: 1.25rem; margin: 30px 0 10px; letter-spacing: -.01em; font-weight: 800; line-height: 1.2; }
h2:first-child { margin-top: 4px; }
h3 { font-size: 1rem; margin: 0 0 6px; font-weight: 800; }
.lede { margin: -4px 0 12px; color: var(--muted); font-size: .9rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }

/* ---------- Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.6;
  color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 14%, transparent); }
.chip.frozen { --c: var(--diner); }
.chip.fridge { --c: var(--ok); }
.chip.thawed { --c: var(--pan); }
.track-pot { --c: var(--pot); } .track-pan { --c: var(--pan); } .track-air { --c: var(--air); } .track-you { --c: var(--you); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- Plan: today */
.today { padding: 16px; position: relative; overflow: hidden; background:
  radial-gradient(120% 90% at 100% 0%, var(--mustard-soft), transparent 60%), var(--surface); }
.kicker { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--accent); }
.today h2 { margin: 2px 0 12px; font-size: 1.45rem; }
.meals2 { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .meals2 { grid-template-columns: 1fr; } }
.mtile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mtile .when { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mtile .name { font-size: 1.06rem; font-weight: 800; line-height: 1.25; }
.mtile .how { font-size: .88rem; color: var(--muted); }
.reminder { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: .9rem; font-weight: 600; }
.reminder[hidden] { display: none; }
.reminder svg.i { margin-top: 1px; }
.btnrow { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 800;
  background: var(--accent); color: var(--accent-ink); border: 0; text-decoration: none; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn svg.i { width: 18px; height: 18px; }

/* 3-step flow strip */
.flow { display: flex; align-items: stretch; gap: 4px; margin: 0 0 12px; }
.flow .fs { flex: 1; min-width: 0; text-align: center; padding: 8px 4px; border-radius: 12px; background: var(--surface-2); font-size: .8rem; font-weight: 700; line-height: 1.25; }
.flow .fs small { display: block; font-weight: 600; color: var(--muted); font-size: .72rem; }
.flow .fs.on { background: var(--accent); color: var(--accent-ink); }
.flow .fs.on small { color: inherit; opacity: .85; }
.flow .arr { flex: none; align-self: center; width: 16px; height: 16px; color: var(--muted); background: none; padding: 0; }
.flow { padding: 0; }

.link { background: none; border: 0; padding: 0; font-weight: 800; text-align: left; color: inherit; text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--accent); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.stat { padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 6px; width: fit-content; }
.stat span { font-size: .76rem; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* week */
.week { display: grid; gap: 8px; }
.day { padding: 8px 14px; display: grid; grid-template-columns: 52px 1fr; gap: 0 8px; }
.day > .dname { grid-row: span 2; padding-top: 10px; font-weight: 800; font-size: .95rem; }
.day > .dname small { display: block; font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.day.is-today { border: 2px solid var(--accent); }
.meal { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; min-width: 0; }
.meal + .meal { border-top: 1px dashed var(--border); }
.meal .when { font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); width: 64px; flex: none; padding-top: 4px; font-weight: 700; }
.meal .what { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
@media (max-width: 420px) { .meal { flex-direction: column; gap: 2px; } .meal .when { width: auto; padding-top: 0; } }
.callout { background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; margin-top: 10px; font-size: .9rem; }
.callout ul { margin: 0; padding-left: 18px; }

/* ---------- Checklists */
.progress { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: .86rem; color: var(--muted); font-weight: 700; }
.count { font-variant-numeric: tabular-nums; min-width: 3.2em; }
.bar { flex: 1; height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .3s; }
.reset { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: .8rem; color: var(--muted); font-weight: 700; }
.list { overflow: hidden; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; cursor: pointer; min-height: 52px; position: relative; }
.row + .row { border-top: 1px solid var(--border); }
.row input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin: 0; flex: none; cursor: pointer;
  border: 2px solid color-mix(in srgb, var(--muted) 70%, transparent); border-radius: 8px; background: var(--surface); display: grid; place-content: center; transition: background .15s, border-color .15s; }
.row input[type=checkbox]::before { content: ""; width: 12px; height: 7px; border: solid var(--surface); border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.row input[type=checkbox]:checked { background: var(--ok); border-color: var(--ok); }
.row input[type=checkbox]:checked::before { opacity: 1; }
.row .body { flex: 1; min-width: 0; }
.row.done .body, .row.done .price, .row.have .body, .row.have .price { opacity: .5; }
.row.done .nm { text-decoration: line-through; text-decoration-thickness: 2px; }
.row:hover { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }

/* prep timeline */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prep .row { padding-left: 18px; }
.prep .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.rowhead { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.time { font-variant-numeric: tabular-nums; font-weight: 800; font-size: .9rem; }
.step-text { display: block; margin-top: 3px; font-size: .94rem; }
.act { font-weight: 800; }
.badge { display: none; font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; }
.badge.upnext { background: var(--mustard); color: var(--mustard-ink); }
.badge.nowb { background: var(--accent); color: var(--accent-ink); }
.prep .row.next { background: color-mix(in srgb, var(--mustard-soft) 80%, transparent); }
.prep .row.next .upnext, .prep .row.now .nowb { display: inline-block; }
.prep .row.now { box-shadow: inset 0 0 0 2px var(--accent); }
.prep .row.next .step-text { font-weight: 600; font-size: 1rem; }
.prep .row.done { min-height: 0; padding-top: 8px; padding-bottom: 8px; align-items: center; }
.prep .row.done .body { display: flex; align-items: baseline; gap: 8px; }
.prep .row.done .chip, .prep .row.done .badge { display: none !important; }
.prep .row.optstep:not(.done) { background: repeating-linear-gradient(-45deg, transparent 0 8px, color-mix(in srgb, var(--surface-2) 70%, transparent) 8px 16px); }
.prep .row.optstep .step-text { font-size: .88rem; color: var(--muted); }
.prep .row.done .step-text { margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .88rem; }
.prep .row.done .nm { text-decoration: none; }
.done-msg { display: none; padding: 12px 14px; text-align: center; font-weight: 800; color: var(--ok); background: var(--ok-soft); border-radius: 14px; margin-top: 10px; }
.done-msg.show { display: block; }
.clock { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; margin-bottom: 10px; }
.clock .t { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.1rem; }
.clock .grow { flex: 1; min-width: 120px; font-size: .86rem; color: var(--muted); }
.kit { margin-bottom: 12px; }
.kit > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; min-height: 48px; cursor: pointer; }
.kit > summary::-webkit-details-marker { display: none; }
.kit > summary h3 { margin: 0; }
.kit[open] > summary .chev { transform: rotate(180deg); }
.kit ul { padding: 0 16px 12px !important; }
.kit ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .kit ul { grid-template-columns: 1fr; } }
.kit li { display: flex; gap: 8px; align-items: baseline; font-size: .92rem; }
.kit li::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); flex: none; transform: translateY(-2px); }
.kit li small { color: var(--muted); }
.warnbox { border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; background: var(--mustard-soft); border: 1px solid color-mix(in srgb, var(--mustard) 60%, var(--border)); }
.warnbox.strong { border-width: 2px; border-color: var(--accent); background: var(--accent-soft); }
.warnbox[hidden] { display: none; }
.warnbox ul { margin: 4px 0 0; padding-left: 18px; font-size: .9rem; }
.warnbox li[hidden] { display: none; }
.rules { margin: 0; padding: 12px 16px 12px 34px; }
.rules li { margin: 5px 0; }

/* ---------- Recipes */
.intro { display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin-bottom: 14px; background: var(--mustard-soft); border-color: color-mix(in srgb, var(--mustard) 50%, var(--border)); }
.intro svg.i { color: var(--accent); margin-top: 2px; }
.intro p { margin: 0; font-size: .92rem; }
.strip { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; overflow-x: auto; margin: 0 -16px 10px; padding: 2px 16px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.strip::-webkit-scrollbar { display: none; }
.strip > * { flex: none; }
.strip .lbl { font-size: .78rem; font-weight: 800; color: var(--muted); padding-right: 2px; }
.strip button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: .86rem; font-weight: 700; }
.strip button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
details.card { margin-bottom: 10px; overflow: hidden; }
details > summary { list-style: none; padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center; min-height: 64px; }
details > summary::-webkit-details-marker { display: none; }
details > summary:focus-visible { outline-offset: -3px; border-radius: 18px; }
.num { width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-content: center; font-weight: 800; font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color: var(--c, var(--accent)); }
summary .title { flex: 1; min-width: 0; }
summary .title b { display: block; line-height: 1.25; font-size: 1.02rem; }
summary .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; align-items: center; font-size: .78rem; color: var(--muted); }
.pp { display: inline-flex; align-items: center; font-weight: 800; font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text); white-space: nowrap; line-height: 1.6; }
.pp.scaled { background: var(--mustard); color: var(--mustard-ink); }
.chev { width: 20px; height: 20px; flex: none; color: var(--muted); transition: transform .2s; }
details[open] > summary .chev { transform: rotate(180deg); }
.rbody { padding: 0 14px 16px; border-top: 1px dashed var(--border); }

.portion-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: 14px 0 4px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }

<script>
// Unit codes for fmtQty (codes are ASCII so the {q|unit} markers work, output is Danish):
//   g, ml      weight/volume. g >= 1000 = kg. ml 100-999 = dl, >= 1000 = L. Decimal comma.
//   tsp        teske (tsk). 3 tsk or more = "1 spsk + 1 tsk". Tiny = "en knivspids".
//   tbsp       spiseske (spsk) for wet stuff. Over 4 spsk turns into ml/dl.
//   dtbsp      spsk for dry stuff (majsstivelse, smør). Never turns into ml.
//   pcs        bare number, halves under 10 ("2½").
//   can jar bag cube pose krus portion box onion haandfuld stk fpose baeger glasboks   counted, Danish singular/plural.
//   box fpose baeger glasboks are containers: always whole, rounded up.
const FRAC = { 0: '', 0.125: '⅛', 0.25: '¼', 0.5: '½', 0.75: '¾' };
const UNITS = {
  tsp: ['tsk', 'tsk'], tbsp: ['spsk', 'spsk'], dtbsp: ['spsk', 'spsk'],
  can: ['dåse', 'dåser'], jar: ['glas', 'glas'], bag: ['brev', 'breve'], cube: ['terning', 'terninger'],
  pose: ['pose', 'poser'], krus: ['krus', 'krus'], portion: ['portion', 'portioner'], box: ['boks', 'bokse'],
  onion: ['løg', 'løg'], haandfuld: ['håndfuld', 'håndfulde'], stk: ['stk', 'stk'],
  fpose: ['frysepose', 'fryseposer'], baeger: ['lille bæger', 'små bægre'], glasboks: ['ovnfast glasboks', 'ovnfaste glasbokse'],
};
// Containers are always whole numbers, rounded up.
const WHOLE = { box: 1, fpose: 1, baeger: 1, glasboks: 1 };

function frac(r) {
  const whole = Math.floor(r);
  return (whole ? whole : '') + FRAC[r - whole];
}

function dec(x) {
  return String(Math.round(x * 10) / 10).replace('.', ',');
}

function metric(v, u) {
  if (u === 'g' && v >= 1000) return dec(v / 1000) + ' kg';
  if (u === 'ml' && v >= 1000) return dec(v / 1000) + ' L';
  if (u === 'ml' && v >= 100) return dec(v / 100) + ' dl';
  if (v >= 250) return Math.round(v / 10) * 10 + ' ' + u;
  if (v >= 10) return Math.round(v / 5) * 5 + ' ' + u;
  return Math.max(1, Math.round(v)) + ' ' + u;
}

function spoonsTsp(v) {
  if (v < 0.2) return 'en knivspids';
  if (v < 3) return frac(Math.max(0.25, Math.round(v * 4) / 4)) + ' tsk';
  const half = Math.round(v * 2) / 2;
  const tb = Math.floor(half / 3);
  const rest = half - tb * 3;
  return tb + ' spsk' + (rest ? ' + ' + frac(rest) + ' tsk' : '');
}

function counted(v) {
  if (v < 0.1) return null;
  if (v < 0.2) return 0.125;
  if (v < 10) return Math.max(0.25, Math.round(v * 4) / 4);
  return Math.round(v);
}

function fmtQty(q, u, f) {
  if (q == null) return '';
  const v = q * (f || 1);
  if (u === 'g' || u === 'ml') return metric(v, u);
  if (u === 'tsp') return spoonsTsp(v);
  if (u === 'tbsp' || u === 'dtbsp') {
    if (v < 0.5) return spoonsTsp(v * 3);
    if (u === 'tbsp' && v > 4) return metric(v * 15, 'ml');
    const r = v > 4 ? Math.round(v) : Math.round(v * 2) / 2;
    return frac(r) + ' spsk';
  }
  if (u === 'pcs') {
    const r = v < 10 ? Math.max(0.5, Math.round(v * 2) / 2) : Math.round(v);
    return frac(r) || '½';
  }
  const r = WHOLE[u] ? Math.max(1, Math.ceil(v - 1e-9)) : counted(v);
  const names = UNITS[u];
  if (r == null) return names ? 'en smule' : 'lidt';
  if (!names) return (frac(r) + ' ' + (u || '')).trim();
  return frac(r) + ' ' + (r > 1 ? names[1] : names[0]);
}

function fmtText(s, f) {
  return s.replace(/\{([\d.]+)\|(\w+)\}/g, (_, q, u) => fmtQty(parseFloat(q), u, f));
}

function packs(it, f) {
  return Math.max(1, Math.ceil((it.need * (f || 1)) / it.size - 1e-9));
}

// All quantities in returned text are {q|unit} markers with ABSOLUTE amounts for the f passed in:
// render them with fmtText(x, 1). Counts (kit, shop need) are absolute for f too.

// Sun = prep day (eaten fresh), Mon-Tue from the fridge, Wed-Sat from the freezer.
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const _HOME = { Sun: 1, Sat: 1 };
const DAY_DA = { Sun: 'Søndag', Mon: 'Mandag', Tue: 'Tirsdag', Wed: 'Onsdag', Thu: 'Torsdag', Fri: 'Fredag', Sat: 'Lørdag' };

// ---------- small helpers
const _r3 = (x) => Math.round(x * 1000) / 1000;
const _cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const _lc1 = (s) => (s ? s.charAt(0).toLowerCase() + s.slice(1) : s);
const _toMap = (recipes) => (Array.isArray(recipes) ? Object.fromEntries(recipes.map((r) => [r.id, r])) : recipes || {});
const _perOf = (r) => r.per || {};
const _minceOf = (r) => (_perOf(r).mince > 0 ? _perOf(r).minceStyle || 'taco' : null);
const _chickenOf = (r) => _perOf(r).chicken || 0;
const _isTaco = (r) => _minceOf(r) === 'taco' || (r.products || []).some((p) => p.id === 'taco' && !p.opt);
const _CONTAINER_UNIT = { box: 'box', glasboks: 'glasboks', pose: 'fpose', baeger: 'baeger' };
const _CONTAINER_BOX = { box: 'boks', glasboks: 'glasboks', pose: 'pose', baeger: 'boks' };
const _unitOf = (r) => _CONTAINER_UNIT[r.container] || 'box';
const _listDa = (a) => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' og ' + a[a.length - 1]);
const _shortName = (r) => String(r.short || r.name || r.id);
const _numDa = (x) => String(Math.round(x * 10) / 10).replace('.', ',');

// Resolve {{k*var|unit}} tokens. Vars: n (portions), c / chicken (chicken portions), m (100 g raw mince), mince (raw g),
// plus anything in vars. With a unit: a {q|unit} marker. Without: plain number (or the string value).
function tpl(s, vars) {
  return String(s == null ? '' : s).replace(/\{\{\s*(?:([\d.]+)\s*\*\s*)?([A-Za-z]+)\s*(?:\|\s*(\w+))?\s*\}\}/g, (m, k, v, u) => {
    let val = vars[v];
    if (v === 'chicken' && !u) u = 'portion';
    if (v === 'mince' && !u) u = 'g';
    if (val == null) return m;
    if (typeof val === 'string') return val;
    val *= k ? parseFloat(k) : 1;
    return u ? `{${_r3(val)}|${u}}` : _numDa(val);
  });
}

// ---------- dates and seeds
function isoWeek(date) {
  const src = date instanceof Date ? date : new Date(date == null ? Date.now() : date);
  const d = new Date(Date.UTC(src.getFullYear(), src.getMonth(), src.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const year = d.getUTCFullYear();
  const week = Math.ceil(((d - Date.UTC(year, 0, 1)) / 864e5 + 1) / 7);
  return { year, week };
}
// The week you shop and prep for: Mon-Fri = this week, Sat/Sun = next week.
function planWeek(date) {
  const d = date instanceof Date ? new Date(date.getTime()) : new Date(date == null ? Date.now() : date);
  const g = d.getDay();
  if (g === 6) d.setDate(d.getDate() + 2);
  else if (g === 0) d.setDate(d.getDate() + 1);
  return isoWeek(d);
}
const weekKey = (w) => `${w.year}-W${String(w.week).padStart(2, '0')}`;
// Seed string for pickWeek: '2026-W42', or '2026-W42#3' after pressing "Bland igen" 3 times.
const seedFor = (w, offset) => weekKey(w) + (offset ? '#' + offset : '');

function _hash32(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function rng(seedStr) {
  let a = _hash32(String(seedStr));
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- week picking
const _chickenLimit = (n) => Math.min(1440, 1200 * Math.max(1, n / 7));
const _batchesFor = (g) => (g > 0 ? Math.max(1, Math.ceil(g / 360 - 1e-9)) : 0);
// Rough prep minutes for pickWeek feasibility (buildPrep is the real thing).
function _estPrep(list) {
  let ch = 0, rice = 0, pasta = 0;
  const ids = new Set(), vars = new Set();
  for (const r of list) {
    ch += _chickenOf(r); rice += _perOf(r).rice || 0; pasta += _perOf(r).pasta || 0;
    ids.add(r.id); const v = _minceOf(r); if (v) vars.add(v);
  }
  const nb = _batchesFor(ch);
  const air = nb ? 16 + nb * 17 : 0;
  const pot = (rice ? 30 : 0) + (pasta ? 22 : 0);
  const pan = vars.size ? 20 + vars.size * 7 : 0;
  return Math.max(air, pot + 8, pan + 6, 20) + 2 * ids.size + 14;
}

function _slotsOf(meals) {
  const out = [];
  DAYS.forEach((day, di) => ['lunch', 'dinner'].forEach((slot) => {
    if (meals && meals[day] && meals[day][slot]) out.push({ day, di, slot, key: `${day}:${slot}` });
  }));
  return out;
}

function _hardOk(assigned, s, r, n, level) {
  if (!r) return false;
  const rs = r.slot || 'lunch';
  if (s.slot === 'lunch' && !_HOME[s.day] && rs !== 'lunch' && rs !== 'both') return false;
  if (r.freezeOk === false && s.di > 2) return false;
  let same = 0;
  for (const k in assigned) {
    if (k === s.key) continue;
    const a = assigned[k];
    if (a.r.id === r.id) { same++; if (a.s.day === s.day) return false; }
  }
  if (same >= 2) return false;
  const list = [r];
  for (const k in assigned) if (k !== s.key) list.push(assigned[k].r);
  // One pan: never more than 2 mince variants, even when the rules are relaxed.
  const vars = new Set(list.map(_minceOf).filter(Boolean));
  if (vars.size > 2) return false;
  if (level >= 1) return true;
  if (level === 0) {
    if (list.filter(_isTaco).length > 3) return false;
    const sauces = new Set(list.filter((x) => _chickenOf(x) > 0).map((x) => x.id));
    if (sauces.size > 3) return false;
  }
  if (list.reduce((a, x) => a + _chickenOf(x), 0) > _chickenLimit(n) + 1e-6) return false;
  if (_estPrep(list) > (n > 10 ? 120 : 90)) return false;
  return true;
}

function _weightOf(assigned, s, r, fresh) {
  const rs = r.slot || 'lunch';
  let w = 1;
  if (s.slot === 'dinner' || _HOME[s.day]) w *= rs === 'dinner' ? 3 : rs === 'both' ? 2.5 : 0.25;
  let same = 0, sameStyle = 0;
  for (const k in assigned) { const a = assigned[k].r; if (a.id === r.id) same++; if (a.style === r.style) sameStyle++; }
  if (same) w *= 0.45;
  if (sameStyle) w *= Math.pow(0.6, sameStyle);
  if (fresh.has(r.id)) w *= 4;
  return w;
}

function _choose(rand, items, weights) {
  const tot = weights.reduce((a, b) => a + b, 0);
  let x = rand() * tot;
  for (let i = 0; i < items.length; i++) { x -= weights[i]; if (x <= 0) return items[i]; }
  return items[items.length - 1];
}

function _makePlan(slots, assigned, byId, seedStr, wk, fresh) {
  const days = DAYS.map((day, di) => {
    const d = { day, name: DAY_DA[day], lunch: null, dinner: null };
    ['lunch', 'dinner'].forEach((slot) => {
      const a = assigned[`${day}:${slot}`];
      if (!a) return;
      const r = a.r;
      const fridge = di <= 2 || r.freezeOk === false;
      d[slot] = { r: r.id, s: fridge ? 'fridge' : 'freezer', thaw: fridge ? null : DAYS[di - 1], box: _CONTAINER_BOX[r.container] || 'boks', slot };
      if (day === 'Sun') d[slot].fresh = true;
    });
    return d;
  });
  const ids = [];
  days.forEach((d) => [d.lunch, d.dinner].forEach((m) => { if (m && !ids.includes(m.r)) ids.push(m.r); }));
  const names = {};
  ids.forEach((id) => { names[id] = _shortName(byId[id]); });
  return { days, recipes: ids, count: slots.length, seed: seedStr, week: wk, names, fresh: [...fresh].filter((id) => ids.includes(id)) };
}

function pickWeek(recipes, meals, seedStr, overrides) {
  const list = (Array.isArray(recipes) ? recipes : Object.values(recipes || {})).filter((r) => r && r.id);
  const byId = _toMap(list);
  meals = meals || DEFAULT_MEALS;
  overrides = overrides || {};
  seedStr = String(seedStr || weekKey(planWeek(new Date())));
  const wk = (/^(\d{4}-W\d{2})/.exec(seedStr) || [])[1] || null;
  const slots = _slotsOf(meals);
  const n = slots.length;
  const fresh = new Set(list.filter((r) => wk && r.added === wk).map((r) => r.id));
  const styleTarget = n >= 5 ? Math.min(3, new Set(list.map((r) => r.style)).size) : 0;
  const forced = {};
  for (const s of slots) { const id = overrides[s.key]; if (id && byId[id]) forced[s.key] = { r: byId[id], s }; }
  const free = slots.filter((s) => !forced[s.key]);
  // lunches first (fewer candidates), then dinners
  const order = free.filter((s) => s.slot === 'lunch').concat(free.filter((s) => s.slot === 'dinner'));
  let best = null;
  for (let attempt = 0; attempt < 120; attempt++) {
    const level = attempt < 100 ? 0 : 1;
    const wantFresh = attempt < 60;
    const rand = rng(seedStr + '|' + attempt);
    const assigned = Object.assign({}, forced);
    let failed = false;
    if (wantFresh) {
      const fr = [...fresh].sort();
      for (let i = fr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [fr[i], fr[j]] = [fr[j], fr[i]]; }
      for (const id of fr) {
        const r = byId[id];
        if (Object.values(assigned).some((a) => a.r.id === id)) continue;
        const open = order.filter((s) => !assigned[s.key] && _hardOk(assigned, s, r, n, level));
        if (!open.length) { failed = true; break; }
        const pref = open.filter((s) => s.slot === (r.slot === 'dinner' ? 'dinner' : 'lunch'));
        const pool = pref.length ? pref : open;
        const s = pool[Math.floor(rand() * pool.length)];
        assigned[s.key] = { r, s };
      }
      if (failed) continue;
    }
    for (const s of order) {
      if (assigned[s.key]) continue;
      const cands = list.filter((r) => _hardOk(assigned, s, r, n, level));
      if (!cands.length) { failed = true; break; }
      const r = _choose(rand, cands, cands.map((r) => _weightOf(assigned, s, r, fresh)));
      assigned[s.key] = { r, s };
    }
    if (failed) continue;
    const styles = new Set(Object.values(assigned).map((a) => a.r.style));
    if (level === 0 && styles.size < styleTarget) { if (!best) best = assigned; continue; }
    return _makePlan(slots, assigned, byId, seedStr, wk, fresh);
  }
  if (best) return _makePlan(slots, best, byId, seedStr, wk, fresh);
  // Last resort: anything that fits the slot.
  const rand = rng(seedStr + '|fallback');
  const assigned = Object.assign({}, forced);
  for (const s of order) {
    let cands = list.filter((r) => _hardOk(assigned, s, r, n, 1));
    if (!cands.length) cands = list.filter((r) => s.slot === 'dinner' || r.slot !== 'dinner');
    if (!cands.length) cands = list;
    if (cands.length) assigned[s.key] = { r: cands[Math.floor(rand() * cands.length)], s };
  }
  return _makePlan(slots, assigned, byId, seedStr, wk, fresh);
}

function _assignedFromPlan(plan, byId) {
  const assigned = {}, slots = [];
  (plan.days || []).forEach((d) => ['lunch', 'dinner'].forEach((slot) => {
    const m = d[slot];
    if (!m) return;
    const s = { day: d.day, di: DAYS.indexOf(d.day), slot, key: `${d.day}:${slot}` };
    slots.push(s);
    if (byId[m.r]) assigned[s.key] = { r: byId[m.r], s };
  }));
  return { assigned, slots };
}

// Valid swaps for "Byt ret" in slotKey ('Wed:dinner'), best fits first.
function alternatives(recipes, plan, slotKey) {
  const list = (Array.isArray(recipes) ? recipes : Object.values(recipes || {})).filter((r) => r && r.id);
  const byId = _toMap(list);
  const { assigned, slots } = _assignedFromPlan(plan, byId);
  const [day, slot] = String(slotKey).split(':');
  const s = slots.find((x) => x.key === slotKey) || { day, slot, di: DAYS.indexOf(day), key: slotKey };
  const cur = assigned[slotKey] && assigned[slotKey].r.id;
  const rest = Object.assign({}, assigned);
  delete rest[slotKey];
  const n = Math.max(1, slots.length);
  const rank = (r) => (s.slot === 'dinner' ? (r.slot === 'dinner' ? 0 : r.slot === 'both' ? 1 : 2) : 0);
  // Strict fits first, then ones that only bend the soft limits (4th chicken sauce, 4th taco meal), then anything that fits the slot.
  const sort = (a) => a.sort((x, y) => rank(x) - rank(y) || String(x.name).localeCompare(String(y.name), 'da'));
  const out = [];
  for (const level of [0, 0.5, 1]) {
    if (level === 1 && out.length) break;
    sort(list.filter((r) => r.id !== cur && !out.includes(r) && _hardOk(rest, s, r, n, level))).forEach((r) => out.push(r));
  }
  return out.map((r) => r.id);
}

// ---------- needs
function _variantDef(v, byId, ids) {
  if (MINCE[v]) return Object.assign({ id: v, builtin: true }, MINCE[v]);
  for (const id of ids) {
    const r = byId[id];
    if (!r || _minceOf(r) !== v) continue;
    if (r.minceVariant) return Object.assign({ id: v, a: v.toUpperCase(), min: 4, n: v, def: v }, r.minceVariant, { owner: r.id });
    const pe = (r.prepExtra || []).find((p) => p.k === 'pan');
    if (pe) {
      const lab = _splitLabel(pe.x || '', '');
      const n = lab.a ? lab.a.toLowerCase() : v;
      return { id: v, n, def: 'kødet til ' + n, min: pe.min || 4, x: pe.x, a: pe.a, owner: r.id, extra: pe, raw: true };
    }
  }
  return { id: v, n: v, def: 'kødet til ' + v, min: 3, x: 'Krydr kødet til {{n|portion}}. Rør rundt, 2 min.', a: 'KRYDR', raw: true };
}

function computeNeeds(plan, recipes, f) {
  f = f || 1;
  const byId = _toMap(recipes);
  const portions = {};
  (plan.days || []).forEach((d) => [d.lunch, d.dinner].forEach((m) => {
    if (m && byId[m.r]) portions[m.r] = _r3((portions[m.r] || 0) + f);
  }));
  const base = { chicken: 0, mince: {}, rice: 0, pasta: 0, wedges: 0 };
  const products = {}, optional = {};
  const add = (id, q, opt) => {
    if (!id || !(q > 0)) return;
    products[id] = _r3((products[id] || 0) + q);
    optional[id] = optional[id] === false ? false : !!opt;
  };
  for (const id in portions) {
    const r = byId[id], n = portions[id], p = _perOf(r);
    base.chicken += (p.chicken || 0) * n;
    const v = _minceOf(r);
    if (v) base.mince[v] = (base.mince[v] || 0) + p.mince * n;
    base.rice += (p.rice || 0) * n;
    base.pasta += (p.pasta || 0) * n;
    base.wedges += (p.wedges || 0) * n;
    (r.products || []).forEach((x) => add(x.id, x.q * n, x.opt));
  }
  const ids = Object.keys(portions);
  for (const v in base.mince) {
    const def = _variantDef(v, byId, ids);
    (def.products || []).forEach((x) => add(x.id, (x.q * base.mince[v]) / 100, false));
  }
  const minceTotal = Object.values(base.mince).reduce((a, b) => a + b, 0);
  for (const k of ['chicken', 'rice', 'pasta', 'wedges']) add(_BASE_PRODUCT[k], base[k], false);
  add(_BASE_PRODUCT.mince, minceTotal, false);
  if (base.chicken) BASE_USE.A.forEach((x) => add(x.id, (x.q * base.chicken) / 1000, false));
  if (minceTotal) BASE_USE.B.forEach((x) => add(x.id, (x.q * minceTotal) / 100, false));
  if (base.rice) BASE_USE.C.forEach((x) => add(x.id, (x.q * base.rice) / 100, false));
  if (base.pasta) BASE_USE.D.forEach((x) => add(x.id, (x.q * base.pasta) / 100, false));
  for (const k of ['chicken', 'rice', 'pasta', 'wedges']) base[k] = _r3(base[k]);
  for (const v in base.mince) base.mince[v] = _r3(base.mince[v]);
  return { base, products, optional, portions, f };
}

// ---------- shopping
const SHOP_SECS = ['Frugt og grønt', 'Kød og køl', 'Frost', 'Kolonial', 'Brød'];
const _shopItem = (id, p, need, opt) => ({
  id, n: p.n, u: p.u === 'pack' ? undefined : p.u, need: _r3(need), size: p.size || 1, label: p.label, unit: p.unit, plural: p.plural,
  price: p.price || 0, where: p.where || 'Alle', alt: p.alt, opt: opt == null ? !!p.opt : !!opt,
});
const _packCount = (it) => Math.max(1, Math.ceil(it.need / it.size - 1e-9));

function buildShop(needs, products, f) {
  const secs = {};
  const order = Object.keys(products);
  const ids = Object.keys(needs.products).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  for (const id of ids) {
    const p = products[id];
    if (!p || p.staple || p.gear) continue;
    const sec = SHOP_SECS.includes(p.sec) ? p.sec : 'Kolonial';
    (secs[sec] = secs[sec] || []).push(_shopItem(id, p, needs.products[id], needs.optional[id]));
  }
  const out = SHOP_SECS.filter((s) => secs[s]).map((sec) => ({ sec, items: secs[sec] }));
  out.portions = Object.values(needs.portions).reduce((a, b) => a + b, 0);
  return out;
}

function priceSummary(shop, portions) {
  let total = 0, withOpt = 0;
  (shop || []).forEach((g) => (g.items || []).forEach((it) => {
    const p = _packCount(it) * (it.price || 0);
    withOpt += p;
    if (!it.opt) total += p;
  }));
  const n = portions || shop.portions || 0;
  return { total, withOpt, perMeal: n ? Math.round(total / n) : 0 };
}

// Starter list: staples + everything this week's recipes use (plan null = every recipe, one portion each).
// secs = DATA.STARTER_SECS ([{ key, sec, note }]) for titles, notes and order.
function buildStarter(recipes, products, plan, secs) {
  const byId = _toMap(recipes);
  let p = plan;
  if (!p) {
    const ids = Object.keys(byId);
    p = { days: ids.map((id) => ({ lunch: { r: id } })) };
  }
  const needs = computeNeeds(p, byId, 1);
  const use = {};
  const mark = (pid, rid) => { (use[pid] = use[pid] || []).includes(rid) || use[pid].push(rid); };
  const ids = Object.keys(needs.portions);
  for (const rid of ids) {
    const r = byId[rid], pr = _perOf(r);
    (r.products || []).forEach((x) => mark(x.id, rid));
    for (const k of ['chicken', 'rice', 'pasta', 'wedges']) if (pr[k] > 0) mark(_BASE_PRODUCT[k], rid);
    if (pr.mince > 0) {
      mark('oksekoed', rid);
      (_variantDef(_minceOf(r), byId, ids).products || []).forEach((x) => mark(x.id, rid));
      BASE_USE.B.forEach((x) => mark(x.id, rid));
    }
    if (pr.chicken > 0) BASE_USE.A.forEach((x) => mark(x.id, rid));
  }
  const usesGlass = ids.some((id) => byId[id].container === 'glasboks');
  const items = {};
  const order = Object.keys(products);
  for (const id of order) {
    const pr = products[id];
    if (!pr) continue;
    const used = needs.products[id] > 0;
    if (pr.gear ? !usesGlass : !(used || pr.staple)) continue;
    const it = _shopItem(id, pr, used ? needs.products[id] : pr.size || 1, used ? needs.optional[id] : null);
    Object.assign(it, { life: pr.life || '', open: pr.open || '', use: (use[id] || []).filter((x) => byId[x]), tip: pr.tip });
    if (pr.gear) it.need = it.size;
    const key = pr.ssec || (pr.staple ? 'basis' : 'toer');
    (items[key] = items[key] || []).push(it);
  }
  const defs = secs && secs.length ? secs : Object.keys(items).map((key) => ({ key, sec: key, note: '' }));
  const out = defs.filter((s) => items[s.key]).map((s) => ({ sec: s.sec, note: s.note || '', items: items[s.key] }));
  Object.keys(items).forEach((k) => { if (!defs.some((s) => s.key === k)) out.push({ sec: k, note: '', items: items[k] }); });
  return out;
}

// ---------- reminders
function reminders(plan, recipes) {
  const byId = recipes ? _toMap(recipes) : {};
  const nm = (id) => (plan.names && plan.names[id]) || (byId[id] && _shortName(byId[id])) || id;
  const out = [];
  let anyFreezer = false, anyLunch = false;
  plan.days.forEach((d) => {
    if (d.lunch) anyLunch = true;
    const ms = [d.lunch, d.dinner].filter((m) => m && m.s === 'freezer');
    if (!ms.length) return;
    anyFreezer = true;
    const groups = {};
    ms.forEach((m) => { (groups[m.box] = groups[m.box] || []).push(nm(m.r)); });
    const parts = Object.keys(groups).map((b) => {
      const c = groups[b].length, names = _listDa(groups[b]);
      if (b === 'pose') return c > 1 ? `${c} fryseposer (${names})` : `frysepose (${names})`;
      if (b === 'glasboks') return c > 1 ? `${c} glasbokse (${names})` : `glasboks (${names})`;
      return c > 1 ? `${c} bokse (${names})` : `boks (${names})`;
    });
    const thaw = ms[0].thaw;
    out.push(`${DAY_DA[thaw]} aften: flyt ${_DAY_GEN[d.day]} ${_listDa(parts)} fra fryser til køleskab.`);
  });
  if (anyFreezer) out.push('Optøede bokse: spis dem inden for 24 timer, og frys dem aldrig igen.');
  if (anyLunch) out.push('Frokost på uni: læg boksen i et køleskab, eller tag den med i en køletaske med et køleelement.');
  return out;
}

// ---------- prep day: a small resource scheduler
// Jobs hold a device (pot | pan | air) from their first to their last phase. Each phase needs `hands` minutes
// of you (single-threaded), then `wait` minutes where the device works alone. The airfryer job also covers
// the microwave (it is one combo device), so they can never overlap.
const _fmtT = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const _fracWord = (r) => (r < 0.3 ? 'En fjerdedel' : r < 0.42 ? 'En tredjedel' : r < 0.58 ? 'Halvdelen' : r < 0.72 ? 'To tredjedele' : 'Tre fjerdedele');

function _splitLabel(x, fallback) {
  const m = /^([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ' -]{1,18}):\s+(.*)$/.exec(x);
  if (m && !/\{/.test(m[1])) return { a: m[1].toUpperCase(), x: _cap(m[2]) };
  return { a: fallback, x };
}
const _actOf = (r) => { const s = _shortName(r).toUpperCase(); return s.length <= 14 ? s : s.split(/\s+/)[0]; };
const _assembleList = (r) => (Array.isArray(r.assemble) ? r.assemble : r.assemble ? [r.assemble] : []).map((x) => (typeof x === 'string' ? { x } : x));

function buildPrep(plan, needs, recipes, data, f) {
  f = f || needs.f || 1;
  data = data || {};
  const T = Object.assign({}, PREP_TEXT, data.PREP_TEXT || {});
  const byId = _toMap(recipes);
  const ids = Object.keys(needs.portions).filter((id) => byId[id]);
  const P = needs.portions;
  const R = ids.map((id) => byId[id]);
  const cnt = (id) => Math.max(1, Math.ceil(P[id] - 1e-9));
  const base = needs.base;
  const chickenG = base.chicken;
  const variants = Object.keys(base.mince).filter((v) => base.mince[v] > 0).sort((a, b) => base.mince[b] - base.mince[a]);
  const minceG = variants.reduce((a, v) => a + base.mince[v], 0);
  const vdef = Object.fromEntries(variants.map((v) => [v, _variantDef(v, byId, ids)]));
  const absorbed = new Set(variants.map((v) => vdef[v].extra).filter(Boolean));
  const usesMicro = R.some((r) => (r.prepExtra || []).some((p) => p.k === 'micro'));

  const jobs = [];
  const job = (o) => { const j = Object.assign({ deps: [], prio: 5, res: null }, o); jobs.push(j); return j; };
  const ph = (k, a, x, hands, wait, extra) => Object.assign({ k, a, x, hands: hands || 0, wait: wait || 0 }, extra || {});

  // Chicken
  let batches = [], chickenOut = [], batchG = 0, nb = 0, lastBatch = null, rawEmpty = false;
  if (chickenG > 0) {
    const kg = chickenG / 1000;
    const klip = Math.max(3, Math.round(6 * kg));
    const prep = job({ id: 'chickenPrep', prio: 0, phases: [
      ph('you', 'KLIP', tpl(T.klip, { g: chickenG, min: klip }), klip),
      ph('you', 'KRYDR', tpl(T.krydr, { k: kg }), 2),
      ph('you', 'VEND', tpl(T.coat, { k: kg }), 3),
      ph('you', 'VASK', T.washHands, 1),
    ] });
    nb = _batchesFor(chickenG);
    batchG = chickenG / nb;
    let prev = prep;
    for (let i = 0; i < nb; i++) {
      const phases = [];
      if (i === 0) {
        phases.push(ph('air', 'TÆND', T.airOn, 1, 3));
        phases.push(ph('air', 'IND', nb === 1 ? tpl(T.batchOnly, { g: chickenG }) : tpl(T.batchFirst, { nb, g: batchG }), 1, 7,
          { onRun: () => { if (nb === 1) rawEmpty = true; } }));
      } else {
        const idx = i - 1;
        phases.push(ph('air', 'SKIFT', tpl(T.batchSwap, { prev: String(i), i: String(i + 1), g: batchG }), 1, 7,
          { onRun: (t) => { chickenOut[idx] = t + 1; if (i === nb - 1) rawEmpty = true; } }));
      }
      phases.push(ph('air', 'VEND', T.batchTurn, 1, 7));
      if (i === nb - 1) phases.push(ph('air', 'UD', nb === 1 ? T.batchOut : T.batchLast, 1, 0, { onRun: (t) => { chickenOut[i] = t + 1; } }));
      const j = job({ id: 'batch' + i, res: 'air', prio: 0, deps: [prev.id], phases });
      batches.push(j);
      prev = j;
    }
    lastBatch = batches[nb - 1];
    job({ id: 'rawBowl', prio: 7, ready: () => rawEmpty, phases: [ph('you', 'VASK', T.rawBowl, 2)] });
  }
  const chickenAt = (g) => (st) => {
    if (!nb) return true;
    const need = Math.ceil(g / batchG - 1e-6);
    let out = 0;
    for (let i = 0; i < nb; i++) if (chickenOut[i] != null && chickenOut[i] <= st.t) out++;
    return out >= Math.min(nb, need);
  };

  // Which recipes take their base out of the shared pot/pan themselves (in a prepExtra)
  const extrasOf = (r) => (r.prepExtra || []).filter((p) => !absorbed.has(p));
  const mentions = (r, re) => extrasOf(r).some((p) => re.test(p.x || ''));
  const keepsPasta = (r) => _perOf(r).pasta > 0 && (extrasOf(r).some((p) => p.k === 'pot') || mentions(r, /pasta/i));
  const keepsRice = (r) => _perOf(r).rice > 0 && mentions(r, /\bris(en)?\b/i);

  // Rice
  const riceJobs = [];
  if (base.rice > 0) {
    const boxR = R.filter((r) => _perOf(r).rice > 0 && !keepsRice(r));
    const keep = R.some(keepsRice);
    const rounds = base.rice > 1000 ? 2 : 1;
    const totalBoxes = boxR.reduce((a, r) => a + cnt(r.id), 0);
    let prev = null;
    for (let i = 0; i < rounds; i++) {
      const k = base.rice / rounds / 200;
      const boxes = rounds === 1 ? totalBoxes : i === 0 ? Math.ceil(totalBoxes / 2) : totalBoxes - Math.ceil(totalBoxes / 2);
      const phases = [
        ph('pot', 'SKYL', tpl(i ? T.riceStart2 : T.riceStart, { k }), 2, 5),
        ph('pot', 'SKRU NED', T.riceLow, 0, 12),
        ph('pot', 'SLUK', T.riceOff, 0, 8),
      ];
      if (boxes > 0) phases.push(ph('pot', 'FORDEL', tpl(keep && i === rounds - 1 ? T.riceSplitRest : T.riceSplit, { n: boxes }), 2));
      else phases.push(ph('pot', 'DAMP AF', T.riceKeep, 1));
      const j = job({ id: 'rice' + i, res: 'pot', prio: -1, deps: prev ? [prev.id] : [], phases });
      riceJobs.push(j);
      prev = j;
    }
  }

  // Pasta
  let pastaJob = null;
  if (base.pasta > 0) {
    const pastaR = R.filter((r) => _perOf(r).pasta > 0);
    const boxP = pastaR.filter((r) => !keepsPasta(r));
    const keep = pastaR.filter(keepsPasta);
    const phases = [
      ph('pot', 'KOG', tpl(riceJobs.length ? T.pastaWater : T.pastaWaterFirst, { s: Math.max(0.5, base.pasta / 200) }), 1, 7),
      ph('pot', 'PENNE', tpl(T.pastaIn, { k: base.pasta / 100 }), 1, 9),
      ph('pot', 'HÆLD FRA', pastaR.length > 1 && keep.length > 0 ? T.pastaDrainSplit : T.pastaDrain, 1),
    ];
    if (boxP.length && (keep.length || boxP.length > 0)) {
      const units = {};
      boxP.forEach((r) => { const u = _unitOf(r); units[u] = (units[u] || 0) + cnt(r.id); });
      const what = _listDa(Object.keys(units).map((u) => `{${units[u]}|${u}}`));
      phases.push(ph('pot', 'FORDEL', tpl(keep.length ? T.pastaSplitRest : T.pastaSplit, { what, names: _listDa(boxP.map((r) => _lc1(_shortName(r)))) }), 2));
    }
    pastaJob = job({ id: 'pasta', res: 'pot', prio: -1, deps: riceJobs.length ? [riceJobs[riceJobs.length - 1].id] : [], phases });
  }

  // Mince: onion, browning, variants, then fill or park
  let minceJob = null;
  const direct = new Set();
  if (minceG > 0) {
    const onion = job({ id: 'onion', prio: 2, phases: [ph('you', 'HAK', tpl(T.onion, { o: minceG / 400 }), 2)] });
    const phases = [];
    if (minceG > 450) {
      phases.push(ph('pan', 'BRUN', tpl(T.brownHalf, { g: minceG / 2, s: minceG / 800 }), 2, 6));
      phases.push(ph('pan', 'BRUN', T.brownSecond, 2, 6));
    } else phases.push(ph('pan', 'BRUN', tpl(T.brown, { g: minceG, s: minceG / 400 }), 2, 6));
    const two = variants.length > 1;
    if (two) {
      const v2 = variants[1];
      phases.push(ph('pan', 'DEL', tpl(T.split, { frac: _fracWord(base.mince[v2] / minceG), g: base.mince[v2], name: vdef[v2].n }), 1));
    }
    variants.forEach((v, vi) => {
      const d = vdef[v];
      const users = R.filter((r) => _minceOf(r) === v);
      const nV = users.reduce((a, r) => a + P[r.id], 0);
      const vars = { m: base.mince[v] / 100, n: nV, mince: base.mince[v] };
      let x = tpl(d.x, vars), a = d.a;
      if (d.raw) { const s = _splitLabel(x, d.a || 'KRYDR'); a = s.a; x = s.x; }
      else x = (two ? (vi === 0 ? T.leadFirst : T.leadSecond) : T.leadOnly) + _lc1(x);
      const hands = Math.min(2, d.min || 2);
      phases.push(ph('pan', a || 'KRYDR', x, hands, Math.max(0, (d.min || 3) - hands)));
      // meat-only recipes go straight from the pan into their boxes; the rest is parked
      const park = [];
      users.forEach((r) => {
        const pr = _perOf(r);
        const only = !(pr.chicken > 0 || pr.rice > 0 || pr.pasta > 0) && !extrasOf(r).length;
        if (only) {
          direct.add(r.id);
          _assembleList(r).forEach((s) => phases.push(ph('pan', s.a || _actOf(r), tpl(s.x, { n: cnt(r.id), c: P[r.id] * (pr.chicken || 0) / 165 }), 1)));
        } else park.push(r);
      });
      if (park.length) {
        const units = {};
        park.forEach((r) => { const u = _unitOf(r); units[u] = (units[u] || 0) + cnt(r.id); });
        const wait = park.some((r) => _perOf(r).pasta > 0) ? 'pastaen' : park.some((r) => _perOf(r).rice > 0) ? 'risen' : 'resten';
        phases.push(ph('pan', 'PARKÉR', tpl(T.park, { Def: _cap(d.def || d.n), what: _listDa(Object.keys(units).map((u) => `{${units[u]}|${u}}`)), wait }), 1));
      }
    });
    minceJob = job({ id: 'mince', res: 'pan', prio: 2, deps: [onion.id], phases });
  }

  // Recipe extras and assembly. Chicken goes to glazed (pan) recipes first, freezer bags last.
  const chickenOrder = R.filter((r) => _perOf(r).chicken > 0).sort((a, b) => {
    const sa = extrasOf(a).some((p) => p.k === 'pan') ? 0 : a.container === 'pose' ? 2 : 1;
    const sb = extrasOf(b).some((p) => p.k === 'pan') ? 0 : b.container === 'pose' ? 2 : 1;
    return sa - sb || P[b.id] - P[a.id] || (a.id < b.id ? -1 : 1);
  });
  const chickenCum = {};
  let cum = 0;
  chickenOrder.forEach((r) => { cum += _perOf(r).chicken * P[r.id]; chickenCum[r.id] = cum; });
  const panJobs = minceJob ? [minceJob] : [];
  const potBase = riceJobs.map((j) => j.id).concat(pastaJob ? [pastaJob.id] : []);
  for (const r of R) {
    if (direct.has(r.id)) continue;
    const pr = _perOf(r);
    const vars = { n: cnt(r.id), c: (P[r.id] * (pr.chicken || 0)) / 165, chicken: (P[r.id] * (pr.chicken || 0)) / 165, mince: P[r.id] * (pr.mince || 0), m: (P[r.id] * (pr.mince || 0)) / 100 };
    const exJobs = [];
    extrasOf(r).forEach((p, i) => {
      const k = p.k === 'micro' ? 'air' : ['pot', 'pan', 'air', 'you'].includes(p.k) ? p.k : 'you';
      const res = k === 'you' ? null : k;
      const min = Math.max(1, p.min || 2);
      const hands = p.hands != null ? p.hands : min <= 3 ? min : 2;
      const deps = [];
      const text = p.x || '';
      const when = p.when;
      let ready = null;
      if (when === 'chicken' || /\{\{\s*(chicken|c)\b/.test(text)) ready = chickenAt(chickenCum[r.id] || 0);
      if (res === 'pan' && minceJob) deps.push(minceJob.id);
      if (res === 'pot') deps.push(...potBase);
      if (pr.pasta > 0 && pastaJob && (res === 'pot' || when === 'pasta' || /pasta/i.test(text))) deps.push(pastaJob.id);
      if (pr.rice > 0 && riceJobs.length && (when === 'rice' || /\bris(en)?\b/i.test(text))) deps.push(...riceJobs.map((j) => j.id));
      if (pr.mince > 0 && minceJob && !deps.includes(minceJob.id)) deps.push(minceJob.id);
      if (res === 'air' && lastBatch) deps.push(lastBatch.id);
      const lab = _splitLabel(tpl(text, vars), p.a || (k === 'pan' ? 'STEG' : k === 'pot' ? 'RØR' : k === 'air' ? 'MIKRO' : 'RØR'));
      const j = job({ id: `x:${r.id}:${i}`, res, prio: deps.length || ready ? 4 : 3, deps: [...new Set(deps)], ready,
        phases: [ph(k, p.a || lab.a, lab.x, Math.min(hands, min), Math.max(0, min - hands))] });
      exJobs.push(j);
      if (res === 'pan') panJobs.push(j);
    });
    const deps = exJobs.map((j) => j.id);
    if (pr.rice > 0) deps.push(...riceJobs.map((j) => j.id));
    if (pr.pasta > 0 && pastaJob) deps.push(pastaJob.id);
    if (pr.mince > 0 && minceJob) deps.push(minceJob.id);
    const steps = _assembleList(r);
    if (!steps.length) continue;
    const hands = Math.min(3, Math.ceil(cnt(r.id) / 2));
    job({ id: 'asm:' + r.id, prio: 5, deps, ready: pr.chicken > 0 ? chickenAt(chickenCum[r.id]) : null,
      phases: steps.map((s, i) => ph('you', s.a || (i ? 'SAML' : _actOf(r)), tpl(s.x, vars), i ? 1 : hands)) });
  }
  if (panJobs.length) job({ id: 'panWash', res: 'pan', prio: 8, deps: panJobs.map((j) => j.id), phases: [ph('you', 'VASK', T.panWash, 2)] });

  // Final: cool and store
  const fridgeDays = [], freezerDays = [];
  plan.days.forEach((d) => {
    const ms = [d.lunch, d.dinner].filter(Boolean);
    if (!ms.length) return;
    if (ms.some((m) => m.s === 'fridge')) fridgeDays.push(d.name);
    if (ms.some((m) => m.s === 'freezer')) freezerDays.push(d.name);
  });
  const hasPose = R.some((r) => r.container === 'pose');
  let store;
  if (!freezerDays.length) store = 'Alt i køleskabet.';
  else if (!fridgeDays.length) store = 'Alt i fryseren.';
  else store = `${_listDa(fridgeDays.map((d, i) => (i ? _lc1(d) : d)))} i køleskabet, resten i fryseren.`;
  const doneTxt = `Låg på${hasPose ? ', posen lukket' : ''}. ${store} Alt er i køl/frys inden for 1 time.`;
  const allIds = jobs.map((j) => j.id);
  job({ id: 'cool', prio: 9, deps: allIds, phases: [ph('you', 'DAMP AF', tpl(T.cool, { what: riceJobs.length || pastaJob ? (chickenG ? 'skål og gryde' : 'gryden') : chickenG ? 'skålene' : 'op' }), 10), ph('you', 'FÆRDIG', doneTxt, 2)] });

  // ---- simulate, minute by minute
  const st = { t: 0, started: {}, done: {} };
  const resFree = { pot: 0, pan: 0, air: 0 };
  let handsFree = 0, handsTotal = 0;
  const running = [];
  const pending = jobs.slice().sort((a, b) => a.prio - b.prio);
  const steps = [];
  const blocks = [];
  const exec = (run, t) => {
    const p = run.job.phases[run.pi];
    steps.push({ t: _fmtT(t), k: p.k, a: p.a, x: p.x, m: t });
    if (p.onRun) p.onRun(t);
    if (p.hands > 0) { handsFree = t + p.hands; handsTotal += p.hands; blocks.push({ k: 'you', s: t, e: t + p.hands, a: p.a }); }
    run.readyAt = t + p.hands + p.wait;
    run.pi++;
    if (run.pi >= run.job.phases.length) {
      st.done[run.job.id] = run.readyAt;
      if (run.job.res) { resFree[run.job.res] = run.readyAt; blocks.push({ k: run.job.res, s: run.start, e: run.readyAt, a: run.job.id }); }
      running.splice(running.indexOf(run), 1);
    }
  };
  for (let t = 0; t < 2000 && (pending.length || running.length); t++) {
    st.t = t;
    let progress = true;
    while (progress) {
      progress = false;
      running.sort((a, b) => a.job.prio - b.job.prio);
      for (const run of running) {
        if (run.readyAt > t) continue;
        const p = run.job.phases[run.pi];
        if (p.hands > 0 && handsFree > t) continue;
        exec(run, t); progress = true; break;
      }
      if (progress) continue;
      for (let i = 0; i < pending.length; i++) {
        const j = pending[i];
        if (!j.deps.every((d) => st.done[d] != null && st.done[d] <= t)) continue;
        if (j.ready && !j.ready(st)) continue;
        if (j.res && (resFree[j.res] > t || running.some((r) => r.job.res === j.res))) continue;
        if (j.phases[0].hands > 0 && handsFree > t) continue;
        pending.splice(i, 1);
        st.started[j.id] = t;
        const run = { job: j, pi: 0, readyAt: t, start: t };
        running.push(run);
        exec(run, t); progress = true; break;
      }
    }
  }
  const end = Math.max(0, ...Object.values(st.done));

  // ---- kit counts
  const boxes = { box: 0, glasboks: 0, fpose: 0, baeger: 0 };
  const usedFor = { glasboks: [], fpose: [], baeger: [] };
  R.forEach((r) => {
    const u = _unitOf(r);
    boxes[u] += cnt(r.id);
    if (usedFor[u]) usedFor[u].push(_lc1(_shortName(r)));
    if (r.sauceCup) { boxes.baeger += cnt(r.id); usedFor.baeger.includes(_lc1(_shortName(r))) || usedFor.baeger.push(_lc1(_shortName(r))); }
  });
  const totalBoxes = boxes.box + boxes.glasboks;
  const kit = [];
  if (totalBoxes) kit.push({ n: 'Madbokse med låg', count: totalBoxes, u: 'box', pl: 'madbokse med låg',
    note: boxes.glasboks ? `Heraf {${boxes.glasboks}|glasboks} til ${_listDa(usedFor.glasboks)}.` : 'Mikroovnsegnede, med låg.' });
  if (boxes.fpose) kit.push({ n: 'Frysepose', count: boxes.fpose, u: 'fpose', pl: 'fryseposer', note: `Til ${_listDa(usedFor.fpose)}.` });
  if (boxes.baeger) kit.push({ n: 'Små bægre med låg', count: boxes.baeger, u: 'baeger', pl: 'små bægre med låg', note: `Til saucen til ${_listDa(usedFor.baeger)}. Små syltetøjsglas virker fint.` });
  (data.KIT_BASE || []).forEach((k) => kit.push(Object.assign({}, k)));

  // ---- day-before steps
  const pre = [];
  if (chickenG > 0) pre.push({ t: 'Dagen før', k: 'you', a: 'TØ OP', x: T.thaw });
  const extra = [];
  if (boxes.fpose) extra.push(`{${boxes.fpose}|fpose}`);
  if (boxes.baeger) extra.push(`{${boxes.baeger}|baeger} med låg`);
  if (totalBoxes || extra.length) {
    let x;
    if (totalBoxes) {
      x = `Find {${totalBoxes}|box} med låg frem` + (boxes.glasboks ? `, heraf {${boxes.glasboks}|glasboks}` : '') + '.';
      if (extra.length) x += ` Plus ${_listDa(extra)}.`;
    } else x = `Find ${_listDa(extra)} frem.`;
    pre.push({ t: 'Dagen før', k: 'you', a: 'FIND', x });
  }
  if (chickenG > 0) pre.push({ t: 'Nødplan', k: 'you', a: 'TØ OP', opt: true, x: usesMicro ? T.emergencyMicro : T.emergency });

  const notes = [];
  if (nb) notes.push(`Kyllingen kører i ${nb} hold à ca. {${Math.round(batchG / 10) * 10}|g}, og det er dem, der sætter tempoet.`);
  if (minceG > 450) notes.push('Over ca. 450 g oksekød: brun det i 2 omgange, ellers koger det i stedet for at brune.');
  if (base.rice > 1000) notes.push('Over 5 krus ris: kog den i 2 omgange.');
  (data.SCALE_NOTES || []).forEach((s) => { if (f >= s.min) notes.push(s.text); });

  const round5 = (m) => Math.max(5, Math.round(m / 5) * 5);
  return {
    steps: pre.concat(steps.map((s) => ({ t: s.t, k: s.k, a: s.a, x: s.x }))),
    minutes: { rutine: round5(end), foersteGang: round5(end * 1.3), aktiv: round5(handsTotal), end },
    kit, notes, blocks, batches: nb, boxes,
  };
}

// One call for the page: everything from (recipes, meals, seed, overrides, f).
function computeAll(data, meals, seedStr, overrides, f) {
  f = f || 1;
  const plan = pickWeek(data.RECIPES, meals, seedStr, overrides);
  const needs = computeNeeds(plan, data.RECIPES, f);
  const shop = buildShop(needs, data.PRODUCTS, f);
  return {
    plan, needs, shop,
    price: priceSummary(shop),
    starter: buildStarter(data.RECIPES, data.PRODUCTS, plan, data.STARTER_SECS),
    prep: buildPrep(plan, needs, data.RECIPES, data, f),
    reminders: reminders(plan, data.RECIPES),
  };
}

/* ---------- Scaling */
function usedLabel(it, f) {
  if (!it.u || it.need == null) return '';
  const v = it.need * f;
  if (it.u === 'stk') return `bruger ${Math.ceil(v)} stk`;
  if ((it.u === 'g' || it.u === 'ml') && v >= 1000) return `bruger ca. ${fmtF(Math.round(v / 100) / 10)} ${it.u === 'g' ? 'kg' : 'L'}`;
  return `bruger ca. ${Math.round(v / 10) * 10 || Math.round(v)} ${it.u}`;
}
/* "2 breve" for count packs, "2 × 400 g" for weight packs. */
function packLabel(it, n) {
  if (n <= 1) return it.label || (it.unit ? '1 ' + it.unit : '');
  if (it.unit) return `${n} ${it.plural || it.unit}`;
  return `${n} × ${it.label || ''}`;
}
const priceOf = (it, f) => (it.need != null && it.size ? packs(it, f) * (it.price || 0) : it.price || 0);
const cardF = (key) => (state.rf[key] != null ? state.rf[key] : state.scale);

function updateCard(card) {
  const key = card.dataset.card, f = cardF(key), base = card.dataset.kind === 'base';
  const custom = state.rf[key] != null;
  const p = 2 * f;
  const label = base ? `x${fmtF(f)}` : `${fracTxt(p)} portion${p === 1 ? '' : 'er'}`;
  setText($('.pout', card), label);
  const pp = $('.pp', card);
  setText(pp, label);
  pp.classList.toggle('scaled', f !== 1);
  const sf = $('.scaled-for', card);
  setText(sf, base ? (f === 1 ? 'normal mængde' : `ganget med ${fmtF(f)}`) : `til ${label}`);
  sf.classList.toggle('on', f !== 1);
  const [minus, plus] = $$('[data-step]', card);
  minus.setAttribute('aria-disabled', f <= 0.5);
  plus.setAttribute('aria-disabled', f >= 8);
  const sync = $('.sync', card);
  sync.classList.toggle('custom', custom);
  $('.sync-txt', sync).textContent = custom ? 'Kun denne ret' : 'Følger slideren';
  $('[data-sync]', sync).hidden = !custom;
  $$('[data-q]', card).forEach((el) => setText(el, fmtQ(parseFloat(el.dataset.q), el.dataset.u, f)));
  $$('[data-raw]', card).forEach((el) => setText(el, fmtT(el.dataset.raw, f)));
}

function update() {
  const f = state.scale;
  try { const cs = getComputedStyle(document.documentElement); flashColors = [cs.getPropertyValue('--mustard').trim(), cs.getPropertyValue('--mustard-ink').trim()]; } catch (e) {}
  if (reduceMotion()) flashColors = null;
  const sl = $('#scale');
  sl.value = f;
  sl.style.setProperty('--fill', ((f - 0.5) / 3.5 * 100) + '%');
  sl.setAttribute('aria-valuetext', `${people(f)}, ${comma(MEALS * f)} måltider`);
  const out = $('#scaleOut');
  if (!out.firstChild) out.innerHTML = '<b></b><em></em>';
  setText($('b', out), `${comma(MEALS * f)} måltider`);
  setText($('em', out), people(f));
  setText($('#tagline'), `${comma(MEALS * f)} måltider · ${timeTxt(f)} · ingen ovn`);
  $$('[data-raw]').forEach((el) => { if (!el.closest('[data-card]')) setText(el, fmtT(el.dataset.raw, f)); });
  $$('[data-meals]').forEach((el) => setText(el, comma(MEALS * f)));
  $$('[data-boxes]').forEach((el) => setText(el, Math.ceil(BOXES * f)));
  $$('[data-kc]').forEach((el) => {
    const c = Math.max(1, Math.ceil(parseFloat(el.dataset.kc) * f - 1e-9));
    setText(el, c);
    const nm = el.nextElementSibling, w = String(c > 1 ? nm.dataset.kpl : nm.dataset.kn);
    const low = w.charAt(0).toLowerCase() + w.slice(1);
    nm.textContent = c === 1 ? fmtT('1 ' + low, 1).slice(2) : low;
  });
  $$('[data-card]').forEach(updateCard);
  setText($('#statMeals'), comma(MEALS * f));
  setText($('#statTime'), timeTxt(f));
  setText($('#prepTimeTxt'), `${timeTxt(f).replace(/^ca\./, 'Ca.')}${FIRST_MIN && f <= 1 ? ` (første gang ca. ${FIRST_MIN} min)` : ''}`);
  const wl = $('#weekendLine');
  if (wl) setText(wl, `${timeTxt(f).replace(/^ca\./, 'Ca.')} i dag giver dig ${comma(MEALS * f)} måltider. Sæt en podcast på.`);
  $('#halfNote').hidden = f >= 1;
  let anyNote = false;
  $$('#scaleNotes [data-min]').forEach((el) => { el.hidden = f < parseFloat(el.dataset.min); if (!el.hidden) anyNote = true; });
  $('#scaleNotes').hidden = !anyNote;
  $('#scaleNotes').classList.toggle('strong', f >= 2);

  const all = [...LIST_ROWS.shop, ...LIST_ROWS.starter];
  all.forEach(({ it, ri }) => {
    const n = it.need != null && it.size ? packs(it, f) : 1;
    setText($(`[data-pack="${ri}"]`), it.need != null && it.size ? packLabel(it, n) + (it.u ? ` (${usedLabel(it, f)})` : '') : (it.label || ''));
    setText($(`[data-price="${ri}"]`), priceOf(it, f) + ' kr');
  });
  totals();
}

function totals() {
  const f = state.scale;
  let per = 0;
  ['shop', 'starter'].forEach((list) => {
    let total = 0, withOpt = 0, left = 0, done = 0, count = 0;
    const seen = new Set();
    LIST_ROWS[list].forEach(({ key, it, pantry }) => {
      if (pantry && !state.lists.shop.first) return;
      if (seen.has(key)) return;
      seen.add(key);
      const price = priceOf(it, f);
      const isDone = !!state.checks[key] || !!state.checks[hkey(key)];
      count++;
      if (isDone) done++;
      withOpt += price;
      if (!it.opt) { total += price; if (!isDone) left += price; }
    });
    setText($(`#${list}Total`), `ca. ${total} kr`);
    setText($(`#${list}Opt`), `med valgfrie: ${withOpt} kr`);
    setText($(`#${list}Left`), `${left} kr`);
    $(`#${list}Count`).textContent = `${done}/${count}`;
    $(`#${list}Count2`).textContent = `${done}/${count}`;
    $(`#${list}MCount`).textContent = `${done}/${count} i kurven`;
    $(`#${list}MLeft`).textContent = `${left} kr`;
    $(`#${list}Bar`).style.width = (count ? 100 * done / count : 0) + '%';
    if (list === 'shop') {
      let weekly = 0;
      DATA.SHOP.forEach((g) => A(g.items).forEach((it) => { if (!it.opt) weekly += priceOf(it, f); }));
      per = Math.round(weekly / (MEALS * f));
    }
  });
  setText($('#statPer'), `${per} kr`);
  prepCounters();
}

function syncRows() {
  $$('[data-key-row]').forEach((r) => {
    const k = r.dataset.keyRow, done = !!state.checks[k], have = !!state.checks[hkey(k)];
    const cb = $('input[data-key]', r);
    cb.checked = done;
    r.classList.toggle('done', done);
    r.classList.toggle('have', have && !done);
    const hb = $('[data-have]', r);
    if (hb) { hb.setAttribute('aria-pressed', have); hb.textContent = have ? 'Har jeg' : 'Har jeg?'; }
  });
  $$('#prepList .row').forEach((r) => {
    const cb = $('input', r);
    cb.checked = !!state.checks[cb.dataset.key];
    r.classList.toggle('done', cb.checked);
  });
}

function applyListTools() {
  ['shop', 'starter'].forEach((list) => {
    const sec = $('#' + list), cfg = state.lists[list];
    const valid = $$('[data-store]', sec).map((b) => b.dataset.store);
    if (!valid.includes(cfg.store)) cfg.store = 'all';
    $$('[data-store]', sec).forEach((b) => b.setAttribute('aria-pressed', b.dataset.store === cfg.store));
    const hide = $('[data-hide]', sec);
    if (hide) hide.checked = cfg.hide;
    const first = $('[data-first]', sec);
    if (first) first.checked = cfg.first;
    const cl = $('.checklist', sec);
    cl.classList.toggle('hide-done', cfg.hide);
    const pg = $('[data-pantry]', sec);
    if (pg) pg.classList.toggle('off', !cfg.first);
    const s = lc(cfg.store), notIn = [];
    $$('.row[data-key-row]', cl).forEach((r) => {
      r.classList.toggle('gone', r.classList.contains('done') || r.classList.contains('have'));
      const w = lc(r.dataset.where);
      const out = s !== 'all' && w !== '' && !(w.includes(s) || w.includes('alle'));
      r.classList.toggle('filtered-out', out);
      const inPantryOff = pg && pg.contains(r) && !cfg.first;
      if (out && !inPantryOff && !r.classList.contains('done') && !r.classList.contains('have')) {
        const row = LIST_ROWS[list].find((x) => x.key === r.dataset.keyRow);
        if (row) notIn.push(`${row.it.n} (${row.it.where}${row.it.alt ? ', ellers ' + row.it.alt : ''})`);
      }
    });
    let visible = 0;
    $$('.grp', cl).forEach((g) => {
      const v = $$('.row', g).filter((r) => !r.classList.contains('filtered-out') && !(cfg.hide && r.classList.contains('gone'))).length;
      g.classList.toggle('empty', v === 0);
      if (!g.classList.contains('off')) visible += v;
    });
    /* Required = not optional, not bought, not "Har jeg", inside the current scope (basics only when folded in). */
    const scope = $$('.grp:not(.off) .row[data-key-row]', cl);
    const rowOf = (r) => LIST_ROWS[list].find((x) => x.key === r.dataset.keyRow);
    const req = scope.filter((r) => { const x = rowOf(r); return x && !x.it.opt && !r.classList.contains('gone'); });
    const reqHere = req.filter((r) => !r.classList.contains('filtered-out'));
    const reqElse = req.filter((r) => r.classList.contains('filtered-out'));
    const inStore = scope.filter((r) => !r.classList.contains('filtered-out')).length;
    const ab = $(`[data-allbought="${list}"]`);
    const storeName = s === 'all' ? '' : (($(`[data-store="${CSS.escape(cfg.store)}"]`, sec) || {}).textContent || cfg.store);
    const missing = [...new Set(reqElse.map((r) => { const x = rowOf(r).it; return `${x.n} (${x.where || 'andet sted'}${x.alt ? ', ellers ' + x.alt : ''})`; }))];
    const showAb = inStore > 0 && reqHere.length === 0;
    ab.classList.toggle('show', showAb);
    ab.classList.toggle('partial', showAb && missing.length > 0);
    if (showAb) ab.innerHTML = missing.length ? `<b>Alt fra ${esc(storeName)} er købt.</b> Mangler stadig: ${missing.map(esc).join(', ')}` : esc(ab.dataset.done);
    const ni = $(`[data-notin="${list}"]`);
    ni.hidden = !notIn.length || showAb;
    ni.innerHTML = notIn.length ? `<b>Ikke i denne butik:</b> ${notIn.map(esc).join(', ')}` : '';
  });
}

/* ---------- Prep progress + clock */
function prepCounters() {
  const boxes = $$('#prepList input[data-key]:not([data-opt])');
  const done = boxes.filter((b) => b.checked).length;
  $('#prepCount').textContent = `${done}/${boxes.length}`;
  $('#prepBar').style.width = (boxes.length ? 100 * done / boxes.length : 0) + '%';
  $$('#prepList .row').forEach((r) => r.classList.remove('next'));
  const next = boxes.find((b) => !b.checked);
  if (next) next.closest('.row').classList.add('next');
  $('#prepDone').classList.toggle('show', boxes.length > 0 && done === boxes.length);
  tickClock();
}
const hm = (d) => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
function tickClock() {
  const btn = $('#clockBtn');
  if (!btn) return;
  const run = state.prepStart != null;
  btn.innerHTML = run ? 'Stop' : ICON.play + 'Start prep';
  btn.classList.toggle('ghost', run);
  let nowI = -1, behind = 0, nextTxt = '';
  const mc = $('#miniClock');
  if (run) {
    const ratio = timeMin(state.scale) / PREP_MIN;
    const sec = Math.max(0, Math.floor((Date.now() - state.prepStart) / 1000));
    const m = Math.floor(sec / 60);
    const tt = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    $('#clockT').textContent = tt;
    STEP_MIN.forEach((t, i) => { if (t != null && t * ratio <= m) nowI = i; });
    const nb = $('#prepList .row.next');
    if (nb) { const s = DATA.PREP[+nb.dataset.i]; nextTxt = `${s.a ? s.a + ' ' : ''}${fmtT(s.x, state.scale)}`; }
    /* Behind = how late the first unticked step with a clock time is. */
    const firstTimed = $$('#prepList input[data-key]:not([data-opt])').map((b) => +b.closest('.row').dataset.i).find((i) => STEP_MIN[i] != null && !state.checks['p:' + i]);
    if (firstTimed != null) behind = Math.floor(m - STEP_MIN[firstTimed] * ratio);
    const end = hm(new Date(state.prepStart + timeMin(state.scale) * 60000));
    $('#clockNote').textContent = (nowI >= 0 ? `Nu: trin ${nowI + 1} (${DATA.PREP[nowI].t}). ` : 'Lige startet. ') + `Færdig ca. kl. ${end}.` +
      (behind > 3 ? ` Du er ca. ${behind} min bagud, bare fortsæt i rækkefølge.` : '');
    if (mc) {
      $('#mcT').textContent = tt;
      $('#mcNext').textContent = nextTxt ? `Næste: ${nextTxt}` : 'Alt er gjort';
      $('#mcBehind').textContent = behind > 3 ? `Ca. ${behind} min bagud, bare fortsæt i rækkefølge.` : '';
      $('#mcBehind').hidden = !(behind > 3);
      const r = $('#clockCard').getBoundingClientRect();
      mc.hidden = !(state.tab === 'plan' && (r.bottom < 0 || r.top > innerHeight));
    }
  } else {
    $('#clockT').textContent = '';
    $('#clockNote').textContent = 'Uret viser, hvor langt du burde være nået.';
    if (mc) mc.hidden = true;
  }
  $$('#prepList .row').forEach((r, i) => r.classList.toggle('now', i === nowI));
}
function startClock() {
  state.prepStart = Date.now();
  const k = $('#kitBox'); if (k) k.open = false;
  save(); clockLoop(); tickClock();
}
let clockTimer = null;
function clockLoop() {
  clearInterval(clockTimer);
  if (state.prepStart != null) clockTimer = setInterval(() => { if (!document.hidden) tickClock(); }, 1000);
}
