function openEat(id, st) {
  const r = R[id];
  if (!r) return;
  const d = $('#sheet');
  const chip = CHIP[st] || '';
  $('#sheetBody').innerHTML = `
    <div class="sheet-head"><div><div class="kicker">Sådan varmer du den</div><h2 class="display" id="sheetTitle">${esc(r.name)}</h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${styleChip(r.style)}${chip}</div></div>
      <button class="close" type="button" data-close aria-label="Luk">${ICON.x}</button></div>
    ${{ freezer: 'Den er i fryseren. Læg den i køleskabet aftenen før, du skal spise den.', tonight: 'Flyt den fra fryseren til køleskabet i aften.', later: 'Den laves på prepdagen søndag.' }[st] ? `<div class="reminder">${ICON.bell}<span>${{ freezer: 'Den er i fryseren. Læg den i køleskabet aftenen før, du skal spise den.', tonight: 'Flyt den fra fryseren til køleskabet i aften.', later: 'Den laves på prepdagen søndag.' }[st]}</span></div>` : ''}
    ${r.img ? `<figure class="hero">${pic(r, 'hpic')}${credit(r)}</figure>` : ''}
    ${eatOf(id) ? `<div class="fact reheat"><strong>Opvarmning</strong>${esc(eatOf(id))}</div>` : ''}
    ${r.reheat && !String(r.reheat).includes(eatOf(id)) ? `<div class="fact"><strong>Godt at vide</strong>${esc(r.reheat)}</div>` : ''}
    <div class="btnrow"><button class="btn" type="button" data-goto="${esc(id)}">Se hele opskriften</button></div>`;
  if (typeof d.showModal === 'function') { try { d.showModal(); return; } catch (e) {} }
  gotoRecipe(id);
}
function gotoRecipe(id) {
  const d = $('#r-' + CSS.escape(id));
  if (!d) return;
  showTab('recipes');
  setFilter('all');
  d.open = true;
  holdHeader = Date.now() + 1500;
  d.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
}

/* ---------- Toast with undo */
let toastT = null, undoFn = null;
function toast(msg, undo) {
  undoFn = undo || null;
  $('#toastTxt').textContent = msg;
  $('#toastBtn').hidden = !undo;
  $('#toast').classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => { $('#toast').classList.remove('show'); undoFn = null; }, 6000);
}

/* ---------- Tabs, theme, header */
function showTab(tab) {
  if (!TABS.includes(tab)) tab = 'plan';
  state.tab = tab;
  $$('nav.tabs button').forEach((b) => {
    const on = b.dataset.tab === tab;
    b.setAttribute('aria-selected', on);
    b.tabIndex = on ? 0 : -1;
  });
  $$('main > section').forEach((s) => { s.hidden = s.id !== tab; });
  document.body.classList.remove('hdr-hidden');
  save();
  requestAnimationFrame(onScroll);
}
function applyTheme() {
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = state.theme;
  const name = { auto: 'Auto', light: 'Lys', dark: 'Mørk' }[state.theme];
  const b = $('#theme');
  b.innerHTML = (ICON[state.theme] || ICON.auto) + `<span class="lbl">${name}</span>`;
  b.setAttribute('aria-label', `Farvetema: ${name}. Tryk for at skifte`);
  let dark = state.theme === 'dark';
  try { if (state.theme === 'auto') dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
  $('meta[name="theme-color"]').setAttribute('content', dark ? '#16110d' : '#fbf3e8');
  if (ready) update();
}
function measureHeader() {
  document.documentElement.style.setProperty('--hh', $('#siteHeader').offsetHeight + 'px');
}
/* Hide the header on scroll down, show on scroll up. Once the totals card scrolls away,
   a fixed one-line bar shows instead. It never changes the page height, so it can't fight touch scrolling. */
let lastY = 0, scrollQueued = false, holdHeader = 0;
function onScroll() {
  scrollQueued = false;
  const y = window.scrollY;
  const hdr = $('#siteHeader');
  const busy = hdr.contains(document.activeElement) || $('#sheet').open || Date.now() < holdHeader;
  if (y > lastY + 6 && y > 140 && !busy) document.body.classList.add('hdr-hidden');
  else if (y < lastY - 6 || y < 140) document.body.classList.remove('hdr-hidden');
  lastY = y;
  const topPx = document.body.classList.contains('hdr-hidden') ? 8 : hdr.offsetHeight + 8;
  $$('.sticky-sum').forEach((s) => {
    const mini = s.nextElementSibling;
    if (!mini || !mini.matches('[data-mini]')) return;
    mini.hidden = s.offsetParent === null || s.getBoundingClientRect().bottom > topPx;
  });
}
window.addEventListener('scroll', () => { if (!scrollQueued) { scrollQueued = true; requestAnimationFrame(onScroll); } }, { passive: true });

/* ---------- Boot */
recompute();
renderPlan(); renderRecipes(); renderShop(); renderStarter();
applyTheme(); showTab(state.tab); syncRows(); update(); applyListTools(); measureHeader(); clockLoop();
ready = true;
save();
window.addEventListener('resize', measureHeader);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}

/* ---------- Events */
$('#scale').addEventListener('input', (e) => {
  state.scale = cleanScale(e.target.value);
  Object.keys(state.rf).forEach((k) => { if (state.rf[k] === state.scale) delete state.rf[k]; });
  update(); save();
});
$('#theme').addEventListener('click', () => {
  state.theme = { auto: 'light', light: 'dark', dark: 'auto' }[state.theme];
  applyTheme(); save();
});
const tabs = $$('nav.tabs button');
tabs.forEach((b, i) => {
  b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo(0, 0); });
  b.addEventListener('keydown', (e) => {
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = tabs.length - 1;
    if (j == null) return;
    e.preventDefault();
    tabs[j].focus(); showTab(tabs[j].dataset.tab);
  });
});

document.addEventListener('change', (e) => {
  const t = e.target;
  const sec = t.closest('section');
  if (t.matches('[data-hide]')) { state.lists[sec.id].hide = t.checked; applyListTools(); save(); return; }
  if (t.matches('[data-first]')) { state.lists.shop.first = t.checked; applyListTools(); totals(); save(); return; }
  const k = t.dataset && t.dataset.key;
  if (!k) return;
  if (t.checked) state.checks[k] = 1; else delete state.checks[k];
  save();
  syncRows();
  if (k.startsWith('p:')) {
    prepCounters();
    if (t.checked) {
      const next = $('#prepList .row.next');
      if (next) {
        const r = next.getBoundingClientRect();
        if (r.top < 0 || r.bottom > innerHeight - 90) next.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
      }
    }
  } else { totals(); setTimeout(applyListTools, cfgHideDelay()); }
});
/* Give a ticked row a beat before it disappears, so you see it was ticked. */
const cfgHideDelay = () => (reduceMotion() ? 0 : 350);

function resetList(list) {
  const before = Object.assign({}, state.checks), prevStart = state.prepStart;
  if (list === 'prep') {
    Object.keys(state.checks).forEach((k) => { if (k.startsWith('p:')) delete state.checks[k]; });
    state.prepStart = null; clockLoop();
  } else {
    LIST_ROWS[list].forEach(({ key }) => { delete state.checks[key]; });
  }
  save(); syncRows(); totals(); applyListTools();
  toast('Flueben nulstillet', () => { state.checks = before; state.prepStart = prevStart; clockLoop(); save(); syncRows(); totals(); applyListTools(); });
}

document.addEventListener('click', (e) => {
  const t = e.target;
  const step = t.closest('[data-step]');
  if (step) {
    if (step.getAttribute('aria-disabled') === 'true') return;
    const card = step.closest('[data-card]'), key = card.dataset.card;
    const f = Math.min(8, Math.max(0.5, cardF(key) + 0.5 * parseInt(step.dataset.step, 10)));
    if (f === state.scale) delete state.rf[key]; else state.rf[key] = f;
    updateCard(card); save();
    return;
  }
  const sync = t.closest('[data-sync]');
  if (sync) { const card = sync.closest('[data-card]'); delete state.rf[card.dataset.card]; updateCard(card); save(); $('[data-step="1"]', card).focus(); return; }
  const have = t.closest('[data-have]');
  if (have) {
    e.preventDefault();
    const hk = hkey(have.dataset.have);
    if (state.checks[hk]) delete state.checks[hk]; else state.checks[hk] = 1;
    save(); syncRows(); totals(); setTimeout(applyListTools, cfgHideDelay());
    return;
  }
  const st = t.closest('[data-store]');
  if (st) { state.lists[st.closest('section').id].store = st.dataset.store; applyListTools(); save(); return; }
  const reset = t.closest('[data-reset]');
  if (reset) { resetList(reset.dataset.reset); return; }
  if (t.closest('#toastBtn')) { if (undoFn) undoFn(); undoFn = null; $('#toast').classList.remove('show'); return; }
  if (t.closest('#clockBtn')) {
    if (state.prepStart == null) startClock(); else { state.prepStart = null; save(); clockLoop(); tickClock(); }
    return;
  }
  if (t.closest('#miniClock')) { const n = $('#prepList .row.next') || $('#clockCard'); n.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' }); return; }
  const tg2 = t.closest('[data-toggle]');
  if (tg2) {
    const [d, sl] = tg2.dataset.toggle.split(':');
    const on = !state.meals[d][sl];
    if (!on && WDAYS.every((x) => ['lunch', 'dinner'].every((y) => (x === d && y === sl) || !state.meals[x][y]))) { toast('Mindst ét måltid skal være slået til'); return; }
    state.meals[d][sl] = on;
    replan(on ? 'Måltid slået til' : 'Måltid slået fra');
    return;
  }
  if (t.closest('[data-reroll]')) { const w = wkState(); w.off++; w.ov = {}; replan('Ny blanding af ugen'); return; }
  const sw = t.closest('[data-swap]');
  if (sw) { openSwap(sw.dataset.swap); return; }
  const pk = t.closest('[data-pick]');
  if (pk) { wkState().ov[pk.dataset.slot] = pk.dataset.pick; $('#sheet').close(); replan('Ret byttet'); return; }
  const sp = t.closest('[data-start-prep]');
  if (sp && state.prepStart == null) startClock();
  const tg = t.closest('[data-tab-go]');
  if (tg) { showTab(tg.dataset.tabGo); window.scrollTo(0, 0); return; }
  const eat = t.closest('[data-eat]');
  if (eat) { e.preventDefault(); openEat(eat.dataset.eat, eat.dataset.st); return; }
  if (t.closest('[data-close]')) { $('#sheet').close(); return; }
  const go = t.closest('[data-goto]');
  if (go) { if ($('#sheet').open) $('#sheet').close(); gotoRecipe(go.dataset.goto); return; }
  if (t === $('#sheet')) { $('#sheet').close(); return; }
  const fb = t.closest('[data-filter]');
  if (fb) setFilter(fb.dataset.filter);
});

/* Re-plan after a toggle, shuffle or swap: recompute, re-render, keep scroll position. */
function replan(msg) {
  const y = scrollY;
  Object.keys(state.checks).forEach((k) => { if (k.startsWith('p:')) delete state.checks[k]; });
  recompute();
  renderPlan(); renderShop();
  syncRows(); update(); applyListTools();
  save();
  scrollTo(0, y);
  if (msg) toast(msg);
}
function openSwap(key) {
  const [d, sl] = key.split(':');
  const cur = DATA.PLAN && DATA.PLAN.days.find((x) => x.day === d);
  const now = cur && cur[sl] ? cur[sl].r : null;
  let ids = [];
  try { ids = alternatives(DATA.RECIPES, DATA.PLAN, key) || []; } catch (e) {}
  ids = ids.filter((id) => R[id] && id !== now).slice(0, 8);
  $('#sheetBody').innerHTML = `
    <div class="sheet-head"><div><div class="kicker">${esc(dayName(cur || d))} ${sl === 'lunch' ? 'frokost' : 'aften'}</div><h2 class="display" id="sheetTitle">Byt ret</h2></div>
      <button class="close" type="button" data-close aria-label="Luk">${ICON.x}</button></div>
    ${ids.length ? `<div class="altlist">${ids.map((id) => `<button type="button" class="alt" data-pick="${esc(id)}" data-slot="${esc(key)}">${pic(R[id], 'thumb')}<span><b>${esc(R[id].name)}</b>${styleChip(R[id].style)}</span></button>`).join('')}</div>` : '<p class="muted">Ingen andre retter passer ind i ugen lige nu. Prøv "Bland igen".</p>'}`;
  const dlg = $('#sheet');
  if (typeof dlg.showModal === 'function') { try { dlg.showModal(); } catch (e) {} }
}

function setFilter(f) {
  $$('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.filter === f));
  $$('#recipes details').forEach((d) => { d.hidden = !(f === 'all' || d.dataset.style === f); });
  $$('.base-h').forEach((el) => { el.hidden = !(f === 'all' || f === 'base'); });
}
</script>
</body>
