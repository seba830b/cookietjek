<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf3e8">
<title>Lazy Prep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 14h26a13 13 0 0 1-26 0z' fill='%23c43a1c'/%3E%3Cpath d='M11 4c-2 2 2 4 0 7M17 3c-2 2 2 4 0 7M23 4c-2 2 2 4 0 7' stroke='%23f3b52f' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------- Tokens */
:root {
  --bg: #fbf3e8; --surface: #fffcf7; --surface-2: #f5eadb; --text: #2b1d13; --muted: #6f5a48; --border: #ead8c1;
  --accent: #c43a1c; --accent-ink: #ffffff; --accent-soft: #fde3d6;
  --mustard: #f3b52f; --mustard-soft: #fdefc6; --mustard-ink: #3a2900;
  --ok: #2f7d32; --ok-soft: #e1f0dc;
  --shadow: 0 1px 0 rgb(90 45 10 / .05), 0 8px 20px -14px rgb(90 45 10 / .35);
  --mexican: #b4400f; --korean: #b0245a; --indian: #9a5500; --italian: #2f7a2f; --diner: #1d5fae; --takeaway: #6a3fd0;
  --pot: #1d5fae; --pan: #9a5500; --air: #c0282a; --you: #4f7a25;
  --hh: 132px; --navh: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16110d; --surface: #211913; --surface-2: #2c231b; --text: #f7ecdf; --muted: #bca794; --border: #3b2e23;
    --accent: #ff7f5e; --accent-ink: #2a0d04; --accent-soft: #3d1e12;
    --mustard: #f5c04a; --mustard-soft: #3b2e10; --mustard-ink: #2a1d00;
    --ok: #7fd481; --ok-soft: #183019;
    --shadow: 0 1px 0 rgb(0 0 0 / .3);
    --mexican: #ff9a6b; --korean: #f57ba6; --indian: #ffb35c; --italian: #7fd481; --diner: #7cc4fa; --takeaway: #b9a2fd;
    --pot: #7cc4fa; --pan: #ffb35c; --air: #ff8f8a; --you: #b4e36a;
  }
}
:root[data-theme="dark"] {
  --bg: #16110d; --surface: #211913; --surface-2: #2c231b; --text: #f7ecdf; --muted: #bca794; --border: #3b2e23;
  --accent: #ff7f5e; --accent-ink: #2a0d04; --accent-soft: #3d1e12;
  --mustard: #f5c04a; --mustard-soft: #3b2e10; --mustard-ink: #2a1d00;
  --ok: #7fd481; --ok-soft: #183019;
  --shadow: 0 1px 0 rgb(0 0 0 / .3);
  --mexican: #ff9a6b; --korean: #f57ba6; --indian: #ffb35c; --italian: #7fd481; --diner: #7cc4fa; --takeaway: #b9a2fd;
  --pot: #7cc4fa; --pan: #ffb35c; --air: #ff8f8a; --you: #b4e36a;
}

/* ---------- Base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--hh) + 12px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}
.display { font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tnum { font-variant-numeric: tabular-nums; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Header */
header.site { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.top { display: flex; align-items: center; gap: 10px; padding-top: 10px; }
.logo { width: 40px; height: 40px; flex: none; }
.top .grow { flex: 1; min-width: 0; }
.top h1 { font-size: 1.4rem; line-height: 1.1; margin: 0; letter-spacing: -.02em; font-weight: 800; }
.top h1 span { color: var(--accent); }
.top p { margin: 0; color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; height: 44px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: .8rem; font-weight: 600; }
.icon-btn svg.i { width: 18px; height: 18px; }

.scale { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 14px; padding: 8px 0 10px; }
.scale label { display: flex; flex-direction: column; line-height: 1.1; min-width: 92px; }
.scale label small { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.scale output { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scale output em { font-style: normal; font-size: .8rem; font-weight: 700; color: var(--accent); margin-left: 2px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; height: 44px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 99px;
  background: linear-gradient(to right, var(--accent) 0 var(--fill, 0%), var(--surface-2) var(--fill, 0%)); border: 1px solid var(--border); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); }
input[type=range]::-moz-range-progress { height: 10px; border-radius: 99px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%;
  background: var(--mustard); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border), 0 2px 6px rgb(0 0 0 / .25); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--mustard); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent); }
input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--accent); }

/* ---------- Tab bar: floating at the bottom */
nav.tabs { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: 10px;
  width: min(calc(100% - 24px), 520px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 5px;
  background: color-mix(in srgb, var(--surface) 94%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 10px 30px -12px rgb(0 0 0 / .4); }
nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 52px;
  background: transparent; border: 0; border-radius: 17px; padding: 4px 2px; font-size: .74rem; font-weight: 700; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
nav.tabs button:not([aria-selected="true"]):hover { background: var(--surface-2); color: var(--text); }

main { padding: 18px 0 calc(var(--navh) + 40px); }
section[hidden] { display: none !important; }
h2 { font-size: 1.25rem; margin: 30px 0 10px; letter-spacing: -.01em; font-weight: 800; line-height: 1.2; }
h2:first-child { margin-top: 4px; }
h2 .count { font-size: .8rem; font-weight: 700; color: var(--muted); margin-left: 6px; }
.lede { margin: -4px 0 12px; color: var(--muted); font-size: .9rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }

/* ---------- Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.6;
  color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 14%, transparent); }
.chip.frozen { --c: var(--diner); }
.chip.fridge { --c: var(--ok); }
.track-pot { --c: var(--pot); } .track-pan { --c: var(--pan); } .track-air { --c: var(--air); } .track-you { --c: var(--you); }

/* ---------- Bump animation for changed numbers */
@keyframes bump { 0% { background-color: var(--mustard); color: var(--mustard-ink); transform: scale(1.12); } 100% { transform: scale(1); } }
.bump { animation: bump .6s ease-out; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- Plan: today */
.today { padding: 16px; position: relative; overflow: hidden; background:
  radial-gradient(120% 90% at 100% 0%, var(--mustard-soft), transparent 60%), var(--surface); }
.today .kicker { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--accent); }
.today h2 { margin: 2px 0 12px; font-size: 1.5rem; }
.meals2 { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .meals2 { grid-template-columns: 1fr; } }
.mtile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mtile .when { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mtile .name { font-size: 1.08rem; font-weight: 800; line-height: 1.25; }
.mtile .how { font-size: .88rem; color: var(--muted); }
.reminder { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: .9rem; font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 700;
  background: var(--accent); color: var(--accent-ink); border: 0; text-decoration: none; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

.link { background: none; border: 0; padding: 0; font-weight: 800; text-align: left; color: inherit; text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-decoration-thickness: 2px; text-underline-offset: 3px; min-height: 0; }
.link:hover { text-decoration-color: var(--accent); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.stat { padding: 10px 12px; }
.stat b { display: block; font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 6px; width: fit-content; }
.stat span { font-size: .76rem; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* week */
.week { display: grid; gap: 8px; }
.day { padding: 8px 14px; display: grid; grid-template-columns: 48px 1fr; gap: 0 10px; }
.day > .dname { grid-row: span 2; padding-top: 10px; font-weight: 800; }
.day > .dname small { display: block; font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.day.is-today { border: 2px solid var(--accent); }
.meal { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; }
.meal + .meal { border-top: 1px dashed var(--border); }
.meal .when { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 50px; flex: none; padding-top: 4px; font-weight: 700; }
.meal .what { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.meal .what .link { margin-right: 2px; }
.meal .eat { flex-basis: 100%; font-size: .82rem; color: var(--muted); }
.callout { background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; margin-top: 10px; font-size: .9rem; }
.callout ul { margin: 0; padding-left: 18px; }

/* ---------- Checklists */
.progress { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: .86rem; color: var(--muted); font-weight: 700; }
.progress .count { font-variant-numeric: tabular-nums; min-width: 3.2em; }
.bar { flex: 1; height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .3s; }
.reset { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: .8rem; color: var(--muted); font-weight: 700; }
.list { overflow: hidden; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; cursor: pointer; min-height: 52px; position: relative; }
.row + .row { border-top: 1px solid var(--border); }
.row input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin: 0; flex: none; cursor: pointer;
  border: 2px solid color-mix(in srgb, var(--muted) 70%, transparent); border-radius: 8px; background: var(--surface); display: grid; place-content: center; transition: background .15s, border-color .15s; }
.row input[type=checkbox]::before { content: ""; width: 12px; height: 7px; border: solid var(--surface); border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.row input[type=checkbox]:checked { background: var(--ok); border-color: var(--ok); }
.row input[type=checkbox]:checked::before { opacity: 1; }
.row .body { flex: 1; min-width: 0; }
.row:has(input:checked) .body, .row:has(input:checked) .price { opacity: .5; }
.row:has(input:checked) .nm { text-decoration: line-through; text-decoration-thickness: 2px; }
.row:hover { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }

/* prep timeline */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prep .row { padding-left: 18px; }
.prep .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.time { font-variant-numeric: tabular-nums; font-weight: 800; font-size: .9rem; margin-right: 6px; }
.step-text { display: block; margin-top: 3px; font-size: .94rem; }
.upnext { display: none; font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; background: var(--mustard); color: var(--mustard-ink); margin-left: 6px; }
.prep .row.next { background: color-mix(in srgb, var(--mustard-soft) 80%, transparent); }
.prep .row.next .upnext { display: inline-block; }
.prep .row.next .step-text { font-weight: 600; font-size: 1rem; }
.done-msg { display: none; padding: 12px 14px; text-align: center; font-weight: 800; color: var(--ok); background: var(--ok-soft); border-radius: 14px; margin-top: 10px; }
.done-msg.show { display: block; }
.scale-note { margin-top: 8px; font-weight: 500; background: var(--mustard-soft); }
.scale-note[hidden] { display: none; }
.sum-top .sub { display: block; font-size: .78rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

.rules { margin: 0; padding: 12px 16px 12px 34px; }
.rules li { margin: 5px 0; }

/* ---------- Recipes */
.intro { display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin-bottom: 14px; background: var(--mustard-soft); border-color: color-mix(in srgb, var(--mustard) 50%, var(--border)); }
.intro svg.i { color: var(--accent); margin-top: 2px; }
.intro p { margin: 0; font-size: .92rem; }
.strip { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px 14px; padding: 2px 16px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.strip::-webkit-scrollbar { display: none; }
.strip > * { flex: none; }
.strip button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: .86rem; font-weight: 700; }
.strip button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
details.card { margin-bottom: 10px; scroll-margin-top: calc(var(--hh) + 12px); overflow: hidden; }
details > summary { list-style: none; padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center; min-height: 64px; }
details > summary::-webkit-details-marker { display: none; }
details > summary:focus-visible { outline-offset: -3px; border-radius: 18px; }
.num { width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-content: center; font-weight: 800; font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color: var(--c, var(--accent)); }
summary .title { flex: 1; min-width: 0; }
summary .title b { display: block; line-height: 1.25; font-size: 1.02rem; }
summary .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; align-items: center; font-size: .78rem; color: var(--muted); }
.pp { display: inline-flex; align-items: center; font-weight: 800; font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text); white-space: nowrap; line-height: 1.6; }
.pp.scaled { background: var(--mustard); color: var(--mustard-ink); }
.chev { width: 20px; height: 20px; flex: none; color: var(--muted); transition: transform .2s; }
details[open] > summary .chev { transform: rotate(180deg); }
.rbody { padding: 0 14px 16px; border-top: 1px dashed var(--border); }

/* portion stepper */
.portion-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: 14px 0 4px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.stepper { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 1.4rem; font-weight: 800; line-height: 1; display: grid; place-content: center; }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper output { min-width: 108px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: 8px; }
.sync { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.sync.custom .dot { background: var(--mustard); }
.sync button { background: none; border: 1px solid var(--border); border-radius: 999px; min-height: 36px; padding: 0 12px; font-size: .78rem; font-weight: 700; color: var(--text); }

.rbody h4 { margin: 16px 0 6px; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.scaled-for { text-transform: none; letter-spacing: 0; font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text); font-weight: 700; }
.scaled-for.on { background: var(--mustard); color: var(--mustard-ink); }
ul.ings { list-style: none; margin: 0; padding: 0; }
ul.ings li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dotted var(--border); }
ul.ings li:last-child { border-bottom: 0; }
.amt { flex: none; width: 5.6em; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 1px 6px; border-radius: 7px; }
.amt:empty::before { content: "+"; color: var(--muted); font-weight: 600; }
.ing { min-width: 0; }
ol.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
ol.steps li { counter-increment: s; position: relative; padding: 4px 0 8px 36px; }
ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--text); color: var(--bg);
  font-size: .8rem; font-weight: 800; display: grid; place-content: center; }
.facts { display: grid; gap: 8px; margin-top: 12px; grid-template-columns: 1fr 1fr; }
.fact { background: var(--surface-2); border-radius: 12px; padding: 9px 12px; font-size: .9rem; min-width: 0; }
.fact strong { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.fact.reheat { background: var(--accent-soft); grid-column: 1 / -1; }
@media (max-width: 420px) { .facts { grid-template-columns: 1fr; } }
.note { font-size: .9rem; margin: 12px 0 0; padding: 10px 12px; border-left: 4px solid var(--mustard); background: color-mix(in srgb, var(--mustard-soft) 60%, transparent); border-radius: 0 10px 10px 0; }

/* ---------- Shopping + starter */
.sticky-sum { position: sticky; top: calc(var(--hh) + 8px); z-index: 10; padding: 10px 14px; margin-bottom: 12px; display: grid; gap: 6px; }
.sum-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.sum-top small { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); }
.sum-top .big { display: block; font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; border-radius: 6px; }
.sum-top .right { text-align: right; }
.sum-top .right .big { font-size: 1.15rem; color: var(--accent); }
.mini { display: flex; align-items: center; gap: 10px; font-size: .8rem; font-weight: 700; color: var(--muted); }
.mini .bar { height: 8px; }
.tools .reset { margin-left: auto; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 6px; }
.tools .lbl { font-size: .78rem; font-weight: 800; color: var(--muted); margin-right: 2px; }
.seg { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 0 12px; font-size: .82rem; font-weight: 700; }
.seg[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; font-size: .84rem; font-weight: 700; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.hide-done .row:has(input:checked) { display: none; }
.sec-title { font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 6px; font-weight: 800; display: flex; justify-content: space-between; }
.sec-note { margin: -2px 0 8px; font-size: .86rem; color: var(--muted); }
.item { display: flex; justify-content: space-between; gap: 10px; }
.nm { font-weight: 650; }
.where { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 3px; font-size: .8rem; color: var(--muted); }
.st { font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.price { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; padding: 0 4px; border-radius: 6px; align-self: flex-start; margin-top: 2px; }
.opt { font-size: .7rem; font-weight: 700; color: var(--muted); border: 1px dashed var(--muted); border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.life { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: .8rem; color: var(--muted); }
.life span b { color: var(--text); font-weight: 650; }
.tipline { display: block; font-size: .84rem; margin-top: 6px; padding-left: 8px; border-left: 3px solid var(--mustard); }
.filtered-out { display: none !important; }
.empty-sec { display: none; }
.stores { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .stores { grid-template-columns: 1fr; } }
.store { padding: 12px 14px; font-size: .9rem; }
.store b { display: block; font-size: 1rem; }
.store .addr { display: flex; gap: 6px; align-items: flex-start; color: var(--accent); font-size: .85rem; font-weight: 700; margin: 2px 0 4px; }
.store .addr svg.i { width: 16px; height: 16px; margin-top: 2px; }
.pantry-sum { padding: 2px 0 8px; }

footer { color: var(--muted); font-size: .78rem; text-align: center; padding: 0 16px calc(var(--navh) + 30px); }

@media (min-width: 760px) {
  .top { padding-top: 14px; }
  .today { padding: 20px 22px; }
  .rbody { padding: 0 20px 20px 62px; }
}
</style>
</head>
<body>
<header class="site" id="siteHeader">
  <div class="wrap">
    <div class="top">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="12" fill="var(--accent)"/>
        <path d="M7 19h26a13 12 0 0 1-26 0z" fill="var(--accent-ink)"/>
        <path d="M13 8c-2 2 2 4 0 7M20 7c-2 2 2 4 0 7M27 8c-2 2 2 4 0 7" stroke="var(--mustard)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="grow">
        <h1 class="display">Lazy <span>Prep</span></h1>
        <p id="tagline">Big-batch comfort food, zero oven</p>
      </div>
      <button class="icon-btn" id="theme" type="button" aria-label="Colour theme: auto. Tap to change"></button>
    </div>
    <div class="scale">
      <label for="scale"><small>Cooking for</small><output id="scaleOut" for="scale" aria-live="polite"></output></label>
      <input id="scale" type="range" min="0.5" max="4" step="0.5" value="1" aria-describedby="scaleHint">
      <span id="scaleHint" class="sr">Scales every amount and price on every tab</span>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="plan" role="tabpanel" aria-labelledby="tab-plan"></section>
  <section id="recipes" role="tabpanel" aria-labelledby="tab-recipes" hidden></section>
  <section id="shop" role="tabpanel" aria-labelledby="tab-shop" lang="da" hidden></section>
  <section id="starter" role="tabpanel" aria-labelledby="tab-starter" lang="da" hidden></section>
</main>
<footer>Prices are rough estimates. Ticks are saved on this device only.</footer>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" id="tab-plan" aria-controls="plan" data-tab="plan" aria-selected="true">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button role="tab" id="tab-recipes" aria-controls="recipes" data-tab="recipes" aria-selected="false">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18a9 8 0 0 1-18 0z"/><path d="M8 3c-1 1.5 1 2.5 0 4.5M12 2.5c-1 1.5 1 2.5 0 4.5M16 3c-1 1.5 1 2.5 0 4.5"/></svg>Recipes</button>
  <button role="tab" id="tab-shop" aria-controls="shop" data-tab="shop" aria-selected="false">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>Shopping</button>
  <button role="tab" id="tab-starter" aria-controls="starter" data-tab="starter" aria-selected="false">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Starter</button>
</nav>

<script>
/*FMT*/
/*DATA*/

const KEY = 'lazyprep:v1';
let state = { checks: {}, scale: 1, tab: 'plan', theme: 'auto', rf: {}, hide: false, store: 'all' };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
if (!state.checks || typeof state.checks !== 'object') state.checks = {};
if (!state.rf || typeof state.rf !== 'object') state.rf = {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const R = Object.fromEntries(DATA.RECIPES.map((r, i) => [r.id, Object.assign({ num: i + 1 }, r)]));
const TRACK = { pot: 'Pot', pan: 'Pan', air: 'Airfryer', you: 'You' };
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const LONG = { Sun: 'Sunday', Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday' };
const styleChip = (s) => `<span class="chip" style="--c:var(--${s})">${esc(DATA.STYLES[s] || s)}</span>`;
const raw = (s) => `<span data-raw="${esc(s)}"></span>`;
const check = (key, label) => `<input type="checkbox" data-key="${key}"${state.checks[key] ? ' checked' : ''}${label ? ` aria-label="${esc(label)}"` : ''}>`;
const storeChips = (w) => String(w || '').split('/').map((x) => x.trim()).filter(Boolean).map((x) => `<span class="st">${esc(x)}</span>`).join('');
const fmtF = (f) => String(f).replace('.', ',');
const ICON = {
  pin: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  bell: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',
  scale: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M12 4v16"/><circle cx="12" cy="12" r="10"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  sun: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  auto: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
};

let ready = false;
const MEALS = DATA.WEEK.length * 2 || 10;
/* Prep length in minutes, from the last h:mm step time. Falls back to 75. */
const PREP_MIN = (() => {
  const t = DATA.PREP.map((s) => /^(\d+):(\d\d)$/.exec(String(s.t).trim())).filter(Boolean).pop();
  return t ? Math.round((+t[1] * 60 + +t[2]) / 5) * 5 : 75;
})();
const SING = { portions: 'portion', boxes: 'box', cups: 'cup', batches: 'batch', tortillas: 'tortilla', bags: 'bag', cans: 'can', jars: 'jar', cubes: 'cube', meals: 'meal', onions: 'onion' };
/* fmtText, plus "1 portions" -> "1 portion" (also with one adjective, e.g. "1 small cups"). */
const fmtT = (s, f) => fmtText(s, f).replace(/(^|[^\d.,¼½¾])1 ((?:small|big|large|extra) )?([a-z]+)\b/g, (m, a, adj, w) => SING[w] ? `${a}1 ${adj || ''}${SING[w]}` : m);
/* Set text and flash it when the value actually changes. */
function setText(el, t) {
  if (!el) return;
  t = String(t);
  if (el.textContent === t) return;
  const had = ready && el.textContent !== '';
  el.textContent = t;
  if (had) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}

/* ---------- Plan */
function todayName() {
  const q = new URLSearchParams(location.search).get('day');
  return q && DAYS.includes(q) ? q : DAYS[new Date().getDay()];
}

function renderPlan() {
  const tn = todayName();
  const styles = new Set(DATA.WEEK.flatMap((d) => [d.lunch, d.dinner].filter((m) => R[m.r]).map((m) => R[m.r].style)));
  const nameOf = (m) => (R[m.r] ? R[m.r].name : m.r);
  const eatOf = (m) => DATA.EAT[m.r] || (R[m.r] && R[m.r].reheat) || '';
  const store = (m) => m.s === 'freezer' ? '<span class="chip frozen">Freezer</span>' : '<span class="chip fridge">Fridge</span>';
  const meal = (label, m) => `
    <div class="meal">
      <span class="when">${label}</span>
      <span class="what">
        <button class="link" type="button" data-goto="${esc(m.r)}">${esc(nameOf(m))}</button>
        ${R[m.r] ? styleChip(R[m.r].style) : ''} ${m.s === 'freezer' ? '<span class="chip frozen">Freezer</span>' : ''}
        <span class="eat">${esc(eatOf(m))}</span>
      </span>
    </div>`;
  const tile = (label, m) => `
    <div class="mtile">
      <span class="when">${label} ${store(m)}</span>
      <button class="link name" type="button" data-goto="${esc(m.r)}">${esc(nameOf(m))}</button>
      <span class="how">${esc(eatOf(m))}</span>
    </div>`;
  const today = DATA.WEEK.find((d) => d.day === tn);
  const rem = DATA.REMINDERS.filter((x) => x.startsWith(tn));
  let hero;
  if (today) {
    hero = `<div class="card today">
      <div class="kicker">Today, ${LONG[tn] || tn}</div>
      <h2 class="display">Grab it, heat it, eat it</h2>
      <div class="meals2">${tile('Lunch', today.lunch)}${tile('Dinner', today.dinner)}</div>
      ${rem.map((x) => `<div class="reminder">${ICON.bell}<span>${esc(x)}</span></div>`).join('')}
    </div>`;
  } else {
    const first = DATA.WEEK[0];
    hero = `<div class="card today">
      <div class="kicker">${LONG[tn] || tn}</div>
      <h2 class="display">No boxes today. Prep day?</h2>
      <p class="muted" style="margin:-4px 0 12px">About ${PREP_MIN} min now buys you ${MEALS} meals. Put a podcast on.</p>
      ${first ? `<div class="meals2">${tile(first.day + ' lunch', first.lunch)}${tile(first.day + ' dinner', first.dinner)}</div>` : ''}
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn" href="#prepH">Start the prep timeline</a>
        <button class="btn ghost" type="button" data-tab-go="shop">Shopping list</button>
      </div>
    </div>`;
  }
  $('#plan').innerHTML = `
    ${hero}
    <div class="stats">
      <div class="card stat"><b>~${PREP_MIN} min</b><span>prep, once a week</span></div>
      <div class="card stat"><b id="statMeals">${MEALS}</b><span>meals</span></div>
      <div class="card stat"><b>${styles.size}</b><span>flavour styles</span></div>
      <div class="card stat"><b id="statPer">-</b><span>per meal</span></div>
    </div>

    <h2 class="display">The week</h2>
    <div class="week">
      ${DATA.WEEK.map((d) => `<div class="card day${d.day === tn ? ' is-today' : ''}"${d.day === tn ? ' aria-current="date"' : ''}>
        <span class="dname">${esc(d.day)}${d.day === tn ? '<small>Today</small>' : ''}</span>${meal('Lunch', d.lunch)}${meal('Dinner', d.dinner)}</div>`).join('')}
    </div>
    <div class="callout"><ul>${DATA.REMINDERS.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>

    <h2 class="display" id="prepH">Prep day timeline</h2>
    <p class="lede">Four things run at once. Tick as you go, the next step lights up. The combo can't microwave and airfry at the same time, so the airfryer owns prep day.</p>
    <div class="legend">${Object.keys(TRACK).map((k) => `<span class="chip track-${k}">${TRACK[k]}</span>`).join('')}</div>
    <div class="progress"><span class="count" id="prepCount"></span><div class="bar" role="presentation"><i id="prepBar"></i></div><button class="reset" type="button" data-reset="p:">Reset</button></div>
    <div class="card list prep">
      ${DATA.PREP.map((s, i) => `
        <label class="row track-${s.k}">${check('p:' + i)}
          <span class="body"><span class="time">${esc(s.t)}</span><span class="chip track-${s.k}">${TRACK[s.k] || esc(s.k)}</span><span class="upnext">Up next</span>
          <span class="step-text">${raw(s.x)}</span></span>
        </label>`).join('')}
    </div>
    <div class="done-msg" id="prepDone">All done. Fridge is full, go lie down.</div>
    <div class="scale-notes" id="scaleNotes">${(DATA.SCALE_NOTES || []).map((n) => `<div class="reminder scale-note" data-min="${n.min}" hidden>${ICON.scale}<span><b>From x${fmtF(n.min)}:</b> ${esc(n.text)}</span></div>`).join('')}</div>

    <h2 class="display">Reheat rules</h2>
    <div class="card"><ul class="rules">${DATA.RULES.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
}

/* ---------- Recipes */
const ingList = (list) => `<ul class="ings">${list.map((x) => `<li><span class="amt"${x.q == null ? '' : ` data-q="${x.q}" data-u="${esc(x.u)}"`}></span><span class="ing">${esc(x.n)}</span></li>`).join('')}</ul>`;
const facts = (o, reheat) => `<div class="facts">
  ${o.fridge ? `<div class="fact"><strong>Fridge</strong>${esc(o.fridge)}</div>` : ''}
  ${o.freezer ? `<div class="fact"><strong>Freezer</strong>${esc(o.freezer)}</div>` : ''}
  ${reheat ? `<div class="fact reheat"><strong>Reheat</strong>${raw(reheat)}</div>` : ''}</div>`;
const portionBar = (key, name, isBase) => `
  <div class="portion-bar">
    <div class="stepper" role="group" aria-label="${isBase ? 'Batch size' : 'Portions'} for ${esc(name)}">
      <button type="button" data-step="-1" aria-label="Less">-</button>
      <output class="pout" aria-live="polite"></output>
      <button type="button" data-step="1" aria-label="More">+</button>
    </div>
    <div class="sync"><span class="dot" aria-hidden="true"></span><span class="sync-txt"></span><button type="button" data-sync hidden>Match slider</button></div>
  </div>`;

function renderRecipes() {
  const used = [...new Set(DATA.RECIPES.map((r) => r.style))];
  const bases = DATA.BASES.map((b) => `
    <details class="card" id="b-${esc(b.id)}" data-style="base" data-card="b:${esc(b.id)}" data-kind="base">
      <summary><span class="num">${esc(b.id)}</span><span class="title"><b>${esc(b.name)}</b>
        <span class="meta"><span class="chip" style="--c:var(--accent)">Base</span><span class="pp"></span> makes ${raw(b.makes)}</span></span>${ICON.chev}</summary>
      <div class="rbody">
        ${portionBar('b:' + b.id, b.name, true)}
        <h4>You need <span class="scaled-for"></span></h4>${ingList(b.ingredients)}
        <h4>Do this</h4><ol class="steps">${b.steps.map((s) => `<li>${raw(s)}</li>`).join('')}</ol>
        ${facts(b)}${b.note ? `<p class="note">${raw(b.note)}</p>` : ''}
      </div>
    </details>`).join('');
  const dishes = Object.values(R).map((r) => `
    <details class="card" id="r-${esc(r.id)}" data-style="${esc(r.style)}" data-card="r:${esc(r.id)}" data-kind="dish" style="--c:var(--${esc(r.style)})">
      <summary><span class="num">${r.num}</span><span class="title"><b>${esc(r.name)}</b>
        <span class="meta">${styleChip(r.style)}<span class="pp"></span>${r.hands} min hands-on, base ${esc(r.bases.join(' + '))}</span></span>${ICON.chev}</summary>
      <div class="rbody">
        ${portionBar('r:' + r.id, r.name, false)}
        <h4>You need <span class="scaled-for"></span></h4>${ingList(r.ingredients)}
        <h4>Do this</h4><ol class="steps">${r.steps.map((s) => `<li>${raw(s)}</li>`).join('')}</ol>
        ${facts(r, r.reheat)}${r.tip ? `<p class="note">${raw(r.tip)}</p>` : ''}
      </div>
    </details>`).join('');
  $('#recipes').innerHTML = `
    <div class="card intro">${ICON.scale}<p><b>Amounts scale.</b> Tap <b>-</b> / <b>+</b> inside a recipe, or drag the slider up top for everything. Changed numbers flash yellow.</p></div>
    <div class="strip" role="group" aria-label="Filter recipes">
      <button type="button" aria-pressed="true" data-filter="all">All</button>
      ${used.map((s) => `<button type="button" aria-pressed="false" data-filter="${esc(s)}">${esc(DATA.STYLES[s] || s)}</button>`).join('')}
      <button type="button" aria-pressed="false" data-filter="base">Bases</button>
    </div>
    <div id="dishes">${dishes}</div>
    <h2 class="display base-h">Base components</h2>
    <p class="lede base-h">Cook these on prep day. Every dish above is just bases + a sauce.</p>
    <div>${bases}</div>`;
}

/* ---------- Shopping */
const storeTools = (items, prefix) => {
  const ws = items.map((x) => String(x.where || '').toLowerCase()).join(' ');
  const keys = DATA.STORES.filter((s) => ws.includes(s.chain.split(' ')[0].toLowerCase()));
  return `
  <div class="strip" role="group" aria-label="Vis kun varer fra en butik">
    <span class="tools"><span class="lbl">Butik</span></span>
    <button type="button" class="seg" data-store="all" aria-pressed="false">Alle</button>
    ${keys.map((s) => `<button type="button" class="seg" data-store="${esc(s.chain.split(' ')[0])}" aria-pressed="false">${esc(s.chain)}</button>`).join('')}
  </div>
  <div class="tools"><label class="toggle"><input type="checkbox" data-hide> Skjul det jeg har købt</label><button class="reset" type="button" data-reset="${prefix}">Nulstil</button></div>`;
};

function renderShop() {
  const row = (key, it, extra) => `
    <label class="row" data-where="${esc(it.where || '')}">${check(key)}
      <span class="body item"><span><span class="nm">${esc(it.n)}</span>${it.opt ? '<span class="opt">valgfri</span>' : ''}
        <span class="where">${extra}</span></span></span>
      <span class="price" ${it.need != null ? `data-price="${key}"` : ''}>${it.need != null ? '' : it.price + ' kr'}</span>
    </label>`;
  $('#shop').innerHTML = `
    <div class="card sticky-sum">
      <div class="sum-top">
        <span><small>Ugen i alt</small><span class="big" id="shopTotal"></span><span class="sub" id="shopOpt"></span></span>
        <span class="right left"><small>Tilbage</small><span class="big" id="shopLeft"></span></span>
      </div>
      <div class="mini"><span class="count tnum" id="shopCount"></span><div class="bar" role="presentation"><i id="shopBar"></i></div></div>
    </div>
    ${storeTools(DATA.SHOP.flatMap((g) => g.items), 's:')}
    <div class="checklist">
    ${DATA.SHOP.map((s, si) => `
      <div class="grp">
      <div class="sec-title"><span>${esc(s.sec)}</span></div>
      <div class="card list">${s.items.map((it, ii) => row(`s:${si}:${ii}`, it, `<span class="tnum" data-pack="s:${si}:${ii}"></span>${storeChips(it.where)}`)).join('')}</div>
      </div>`).join('')}
    </div>
    <p class="muted small" style="margin-top:14px">Første gang? Tjek <button class="link" type="button" data-tab-go="starter">Starter-listen</button> med alt til alle ${DATA.RECIPES.length} opskrifter.</p>
    <h2 class="display">Basisvarer</h2>
    <p class="lede">Købes én gang og holder i ugevis. Ikke med i ugens total. I alt ca. <b>${DATA.PANTRY.reduce((a, x) => a + x.price, 0)} kr</b>.</p>
    <div class="card list">${DATA.PANTRY.map((it, i) => row('b:' + i, it, esc(it.label))).join('')}</div>`;
}

/* ---------- Starter kit */
function renderStarter() {
  const nums = (ids) => ids && ids.length ? ids.filter((id) => R[id]).map((id) => '#' + R[id].num).join(' ') : 'alt';
  $('#starter').innerHTML = `
    <h2 class="display">Starter-indkøbsliste</h2>
    <p class="lede">Alt til alle ${DATA.RECIPES.length} opskrifter. Køb én gang, så skal du kun købe kød, ost og mejeri hver uge. Holdbarhed er tommelfingerregler, pakken vinder altid.</p>
    <div class="card sticky-sum">
      <div class="sum-top">
        <span><small>Starter i alt</small><span class="big" id="kitTotal"></span><span class="sub" id="kitOpt"></span></span>
        <span class="right left"><small>Tilbage</small><span class="big" id="kitLeft"></span></span>
      </div>
      <div class="mini"><span class="count tnum" id="kitCount"></span><div class="bar" role="presentation"><i id="kitBar"></i></div></div>
    </div>
    <p class="muted small">Totalen er uden de valgfrie ting. Skalerer med slideren: x1 = ${MEALS} måltider, én af hver ret. x4 = ${MEALS * 4} måltider. Køl-varerne skal du stadig købe løbende, de holder ikke en måned.</p>
    <h2 class="display">Hvor i Svendborg</h2>
    <div class="stores">${DATA.STORES.map((s) => `<div class="card store"><b>${esc(s.chain)}</b><span class="addr">${ICON.pin}<span>${esc(s.where)}</span></span><div class="muted small">${esc(s.why)}</div></div>`).join('')}</div>
    <div class="callout">Nemmeste tur: Lidl (Mølmarksvej 185) + Netto (Mølmarksvej 50) ligger på samme vej og dækker næsten det hele.</div>
    <h2 class="display">Listen</h2>
    ${storeTools(DATA.STARTER.flatMap((g) => g.items), 'k:')}
    <div class="checklist">
    ${DATA.STARTER.map((g, gi) => `
      <div class="grp">
      <div class="sec-title"><span>${esc(g.sec)}</span></div>
      ${g.note ? `<p class="sec-note">${esc(g.note)}</p>` : ''}
      <div class="card list">${g.items.map((x, i) => `
        <label class="row" data-where="${esc(x.where || '')}">${check(`k:${gi}:${i}`)}
          <span class="body"><span class="nm">${esc(x.n)}</span>${x.opt ? '<span class="opt">valgfri</span>' : ''}
            <span class="where"><span class="tnum" data-kpack="k:${gi}:${i}"></span>${storeChips(x.where)}</span>
            <span class="life"><span>Uåbnet <b>${esc(x.life)}</b></span><span>Åbnet <b>${esc(x.open)}</b></span></span>
            <span class="where">Bruges i ${nums(x.use)}</span>
            ${x.tip ? `<span class="tipline">${esc(x.tip)}</span>` : ''}</span>
          <span class="price" data-kprice="k:${gi}:${i}"></span>
        </label>`).join('')}</div>
      </div>`).join('')}
    </div>`;
}

/* ---------- Scaling */
function usedLabel(it, f) {
  if (!it.u) return '';
  let v = it.need * f;
  if (it.u === 'stk') return `bruger ${Math.ceil(v)} stk`;
  if (it.u === 'g' && v >= 1000) return `bruger ca. ${String(Math.round(v / 100) / 10).replace('.', ',')} kg`;
  return `bruger ca. ${Math.round(v / 10) * 10 || Math.round(v)} ${it.u}`;
}
const packLabel = (it, n) => (n > 1 ? n + ' x ' : '') + it.label;
const cardF = (key) => (state.rf[key] != null ? state.rf[key] : state.scale);

function updateCard(card) {
  const key = card.dataset.card, f = cardF(key), base = card.dataset.kind === 'base';
  const custom = state.rf[key] != null;
  const label = base ? `x${fmtF(f)} batch` : `${2 * f} portion${2 * f === 1 ? '' : 's'}`;
  setText($('.pout', card), label);
  const pp = $('.pp', card);
  setText(pp, label);
  pp.classList.toggle('scaled', f !== 1);
  const sf = $('.scaled-for', card);
  setText(sf, base ? (f === 1 ? 'normal batch' : `scaled x${fmtF(f)}`) : `for ${label}`);
  sf.classList.toggle('on', f !== 1);
  const [minus, plus] = $$('[data-step]', card);
  minus.disabled = f <= 0.5; plus.disabled = f >= 8;
  const sync = $('.sync', card);
  sync.classList.toggle('custom', custom);
  $('.sync-txt', sync).textContent = custom ? 'Just this recipe' : 'Follows the slider';
  $('[data-sync]', sync).hidden = !custom;
  $$('[data-q]', card).forEach((el) => setText(el, fmtQty(parseFloat(el.dataset.q), el.dataset.u, f)));
  $$('[data-raw]', card).forEach((el) => setText(el, fmtT(el.dataset.raw, f)));
}

function update() {
  const f = state.scale;
  const sl = $('#scale');
  sl.value = f;
  sl.style.setProperty('--fill', ((f - 0.5) / 3.5 * 100) + '%');
  sl.setAttribute('aria-valuetext', `${MEALS * f} meals, times ${f}`);
  $('#scaleOut').innerHTML = `${MEALS * f} meals<em>x${fmtF(f)}</em>`;
  $$('[data-raw]').forEach((el) => { if (!el.closest('[data-card]')) setText(el, fmtT(el.dataset.raw, f)); });
  $$('[data-card]').forEach(updateCard);
  setText($('#statMeals'), MEALS * f);
  $$('#scaleNotes [data-min]').forEach((el) => { el.hidden = f < parseFloat(el.dataset.min); });

  let total = 0, left = 0, all = 0;
  DATA.SHOP.forEach((s, si) => s.items.forEach((it, ii) => {
    const key = `s:${si}:${ii}`, n = packs(it, f), price = n * it.price;
    all += price;
    if (!it.opt) { total += price; if (!state.checks[key]) left += price; }
    setText($(`[data-pack="${key}"]`), packLabel(it, n) + (it.u ? ` (${usedLabel(it, f)})` : ''));
    setText($(`[data-price="${key}"]`), price + ' kr');
  }));
  setText($('#shopTotal'), `ca. ${total} kr`);
  setText($('#shopOpt'), `med valgfrie: ${all} kr`);
  setText($('#shopLeft'), `${left} kr`);
  let kit = 0, kitLeft = 0, kitAll = 0;
  DATA.STARTER.forEach((g, gi) => g.items.forEach((it, i) => {
    const key = `k:${gi}:${i}`, n = packs(it, f), price = n * it.price;
    kitAll += price;
    if (!it.opt) { kit += price; if (!state.checks[key]) kitLeft += price; }
    setText($(`[data-kpack="${key}"]`), packLabel(it, n) + (it.u ? `, ${usedLabel(it, f)}` : ''));
    setText($(`[data-kprice="${key}"]`), price + ' kr');
  }));
  setText($('#kitTotal'), `ca. ${kit} kr`);
  setText($('#kitOpt'), `med valgfrie: ${kitAll} kr`);
  setText($('#kitLeft'), `${kitLeft} kr`);
  setText($('#statPer'), `${Math.round(total / (MEALS * f))} kr`);
  counters();
}

function counters() {
  const count = (prefix, label, bar) => {
    const boxes = $$(`input[data-key^="${prefix}"]`), done = boxes.filter((b) => b.checked).length;
    $(label).textContent = `${done}/${boxes.length}`;
    $(bar).style.width = (boxes.length ? 100 * done / boxes.length : 0) + '%';
    return done === boxes.length;
  };
  const prepDone = count('p:', '#prepCount', '#prepBar');
  count('s:', '#shopCount', '#shopBar');
  count('k:', '#kitCount', '#kitBar');
  $$('.prep .row').forEach((r) => r.classList.remove('next'));
  const next = $$('.prep input[data-key]').find((b) => !b.checked);
  if (next) next.closest('.row').classList.add('next');
  $('#prepDone').classList.toggle('show', prepDone);
}

/* ---------- Store filter + hide bought */
function applyListTools() {
  const s = state.store || 'all';
  $$('[data-store]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.store === s));
  $$('[data-hide]').forEach((b) => { b.checked = !!state.hide; });
  $$('.checklist').forEach((c) => c.classList.toggle('hide-done', !!state.hide));
  $$('.checklist .row[data-where]').forEach((r) => {
    const w = r.dataset.where.toLowerCase();
    r.classList.toggle('filtered-out', s !== 'all' && !(w.includes(s.toLowerCase()) || w.includes('alle')));
  });
  $$('.checklist .grp').forEach((g) => {
    g.classList.toggle('filtered-out', !$$('.row', g).some((r) => !r.classList.contains('filtered-out')));
  });
}

/* ---------- Tabs, theme, events */
function showTab(tab) {
  if (!$('#' + tab)) tab = 'plan';
  state.tab = tab;
  $$('nav.tabs button').forEach((b) => {
    const on = b.dataset.tab === tab;
    b.setAttribute('aria-selected', on);
    b.tabIndex = on ? 0 : -1;
  });
  $$('main > section').forEach((s) => { s.hidden = s.id !== tab; });
  save();
}

function applyTheme() {
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = state.theme;
  const name = { auto: 'Auto', light: 'Light', dark: 'Dark' }[state.theme] || 'Auto';
  const b = $('#theme');
  b.innerHTML = ICON[state.theme] + `<span>${name}</span>`;
  b.setAttribute('aria-label', `Colour theme: ${name}. Tap to change`);
  const dark = state.theme === 'dark' || (state.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('meta[name="theme-color"]').setAttribute('content', dark ? '#16110d' : '#fbf3e8');
}

function measureHeader() {
  const h = $('#siteHeader').offsetHeight;
  document.documentElement.style.setProperty('--hh', h + 'px');
}

if (!['auto', 'light', 'dark'].includes(state.theme)) state.theme = 'auto';
$('#tagline').textContent = `${MEALS} meals, ~${PREP_MIN} min, no oven`;
renderPlan(); renderRecipes(); renderShop(); renderStarter();
applyTheme(); showTab(state.tab); update(); applyListTools(); measureHeader();
ready = true;
window.addEventListener('resize', measureHeader);

$('#scale').addEventListener('input', (e) => { state.scale = parseFloat(e.target.value); state.rf = {}; update(); save(); });
$('#theme').addEventListener('click', () => {
  state.theme = { auto: 'light', light: 'dark', dark: 'auto' }[state.theme];
  applyTheme(); save();
});
const tabs = $$('nav.tabs button');
tabs.forEach((b, i) => {
  b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo(0, 0); });
  b.addEventListener('keydown', (e) => {
    const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
    if (!d) return;
    const t = tabs[(i + d + tabs.length) % tabs.length];
    t.focus(); showTab(t.dataset.tab);
  });
});
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}

document.addEventListener('change', (e) => {
  if (e.target.matches('[data-hide]')) { state.hide = e.target.checked; applyListTools(); save(); return; }
  const k = e.target.dataset && e.target.dataset.key;
  if (!k) return;
  if (e.target.checked) state.checks[k] = 1; else delete state.checks[k];
  save();
  if (k.startsWith('s:') || k.startsWith('k:')) update(); else counters();
});

document.addEventListener('click', (e) => {
  const step = e.target.closest('[data-step]');
  if (step) {
    const card = step.closest('[data-card]'), key = card.dataset.card;
    const f = Math.min(8, Math.max(0.5, cardF(key) + 0.5 * parseInt(step.dataset.step, 10)));
    if (f === state.scale) delete state.rf[key]; else state.rf[key] = f;
    updateCard(card); save();
    return;
  }
  const sync = e.target.closest('[data-sync]');
  if (sync) { const card = sync.closest('[data-card]'); delete state.rf[card.dataset.card]; updateCard(card); save(); return; }
  const st = e.target.closest('[data-store]');
  if (st) { state.store = st.dataset.store; applyListTools(); save(); return; }
  const reset = e.target.closest('[data-reset]');
  if (reset) {
    const p = reset.dataset.reset;
    Object.keys(state.checks).forEach((k) => { if (k.startsWith(p)) delete state.checks[k]; });
    $$(`input[data-key^="${p}"]`).forEach((b) => { b.checked = false; });
    save(); update();
    return;
  }
  const tg = e.target.closest('[data-tab-go]');
  if (tg) { showTab(tg.dataset.tabGo); window.scrollTo(0, 0); return; }
  const go = e.target.closest('[data-goto]');
  if (go) {
    const d = $('#r-' + go.dataset.goto);
    if (!d) return;
    showTab('recipes');
    setFilter('all');
    d.open = true;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    d.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    return;
  }
  const fb = e.target.closest('[data-filter]');
  if (fb) setFilter(fb.dataset.filter);
});

function setFilter(f) {
  $$('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.filter === f));
  $$('#recipes details').forEach((d) => { d.hidden = !(f === 'all' || d.dataset.style === f); });
  $$('.base-h').forEach((el) => { el.hidden = !(f === 'all' || f === 'base'); });
}
</script>
