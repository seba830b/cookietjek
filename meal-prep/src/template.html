<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf3e8">
<title>Lazy Prep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 14h26a13 13 0 0 1-26 0z' fill='%23c43a1c'/%3E%3Cpath d='M11 4c-2 2 2 4 0 7M17 3c-2 2 2 4 0 7M23 4c-2 2 2 4 0 7' stroke='%23f3b52f' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------- Tokens */
:root {
  --bg: #fbf3e8; --surface: #fffcf7; --surface-2: #f5eadb; --text: #2b1d13; --muted: #6f5a48; --border: #ead8c1;
  --accent: #c43a1c; --accent-ink: #ffffff; --accent-soft: #fde3d6;
  --mustard: #f3b52f; --mustard-soft: #fdefc6; --mustard-ink: #3a2900;
  --ok: #2f7d32; --ok-soft: #e1f0dc; --ok-ink: #ffffff;
  --shadow: 0 1px 0 rgb(90 45 10 / .05), 0 8px 20px -14px rgb(90 45 10 / .35);
  --mexican: #b4400f; --korean: #b0245a; --indian: #9a5500; --italian: #2f7a2f; --diner: #1d5fae; --takeaway: #6a3fd0;
  --pot: #1d5fae; --pan: #9a5500; --air: #c0282a; --you: #4f7a25;
  --hh: 132px; --navh: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16110d; --surface: #211913; --surface-2: #2c231b; --text: #f7ecdf; --muted: #bca794; --border: #3b2e23;
    --accent: #ff7f5e; --accent-ink: #2a0d04; --accent-soft: #3d1e12;
    --mustard: #f5c04a; --mustard-soft: #3b2e10; --mustard-ink: #2a1d00;
    --ok: #7fd481; --ok-soft: #183019; --ok-ink: #0c2410;
    --shadow: 0 1px 0 rgb(0 0 0 / .3);
    --mexican: #ff9a6b; --korean: #f57ba6; --indian: #ffb35c; --italian: #7fd481; --diner: #7cc4fa; --takeaway: #b9a2fd;
    --pot: #7cc4fa; --pan: #ffb35c; --air: #ff8f8a; --you: #b4e36a;
  }
}
:root[data-theme="dark"] {
  --bg: #16110d; --surface: #211913; --surface-2: #2c231b; --text: #f7ecdf; --muted: #bca794; --border: #3b2e23;
  --accent: #ff7f5e; --accent-ink: #2a0d04; --accent-soft: #3d1e12;
  --mustard: #f5c04a; --mustard-soft: #3b2e10; --mustard-ink: #2a1d00;
  --ok: #7fd481; --ok-soft: #183019; --ok-ink: #0c2410;
  --shadow: 0 1px 0 rgb(0 0 0 / .3);
  --mexican: #ff9a6b; --korean: #f57ba6; --indian: #ffb35c; --italian: #7fd481; --diner: #7cc4fa; --takeaway: #b9a2fd;
  --pot: #7cc4fa; --pan: #ffb35c; --air: #ff8f8a; --you: #b4e36a;
}

/* ---------- Base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--hh) + 12px); scroll-padding-bottom: calc(var(--navh) + 24px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}
.display { font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 10px; font-weight: 800; }
.skip:focus { top: 10px; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tnum { font-variant-numeric: tabular-nums; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Header (slides away on scroll down, back on scroll up) */
header.site { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); transition: transform .25s ease; }
.hdr-hidden header.site { transform: translateY(-100%); }
.top { display: flex; align-items: center; gap: 10px; padding-top: 10px; }
.logo { width: 40px; height: 40px; flex: none; }
.top .grow { flex: 1; min-width: 0; }
.top h1 { font-size: 1.4rem; line-height: 1.1; margin: 0; letter-spacing: -.02em; font-weight: 800; }
.top h1 span { color: var(--accent); }
.top p { margin: 1px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.25; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; height: 44px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: .8rem; font-weight: 700; }
.icon-btn svg.i { width: 18px; height: 18px; }
@media (max-width: 420px) { .icon-btn { padding: 0; } .icon-btn .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }

.scale { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 14px; padding: 6px 0 8px; }
.scale label { display: flex; flex-direction: column; line-height: 1.15; min-width: 96px; }
.scale label small { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
.scale output b { display: block; font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scale output em { display: block; font-style: normal; font-size: .76rem; font-weight: 700; color: var(--accent); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; height: 44px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 99px;
  background: linear-gradient(to right, var(--accent) 0 var(--fill, 0%), var(--surface-2) var(--fill, 0%)); border: 1px solid var(--border); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--border); }
input[type=range]::-moz-range-progress { height: 10px; border-radius: 99px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border-radius: 50%;
  background: var(--mustard); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border), 0 2px 6px rgb(0 0 0 / .25); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--mustard); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border); }
input[type=range]:focus-visible { outline: none; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent); }
input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--accent); }

/* ---------- Tab bar: floating at the bottom */
nav.tabs { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: 10px;
  width: min(calc(100% - 20px), 520px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 5px;
  background: color-mix(in srgb, var(--surface) 94%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 10px 30px -12px rgb(0 0 0 / .4); }
nav.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 50px; min-width: 0;
  background: transparent; border: 0; border-radius: 17px; padding: 4px 2px; font-size: .72rem; font-weight: 700; color: var(--muted); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
nav.tabs button:not([aria-selected="true"]):hover { background: var(--surface-2); color: var(--text); }

main.wrap { padding-top: 16px; padding-bottom: calc(var(--navh) + 24px); }
section[hidden] { display: none !important; }
h2 { font-size: 1.25rem; margin: 30px 0 10px; letter-spacing: -.01em; font-weight: 800; line-height: 1.2; }
h2:first-child { margin-top: 4px; }
h3 { font-size: 1rem; margin: 0 0 6px; font-weight: 800; }
.lede { margin: -4px 0 12px; color: var(--muted); font-size: .9rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }

/* ---------- Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.6;
  color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 14%, transparent); }
.chip.frozen { --c: var(--diner); }
.chip.fridge { --c: var(--ok); }
.chip.thawed { --c: var(--pan); }
.track-pot { --c: var(--pot); } .track-pan { --c: var(--pan); } .track-air { --c: var(--air); } .track-you { --c: var(--you); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- Plan: today */
.today { padding: 16px; position: relative; overflow: hidden; background:
  radial-gradient(120% 90% at 100% 0%, var(--mustard-soft), transparent 60%), var(--surface); }
.kicker { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--accent); }
.today h2 { margin: 2px 0 12px; font-size: 1.45rem; }
.meals2 { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 560px) { .meals2 { grid-template-columns: 1fr; } }
.mtile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mtile .when { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mtile .name { font-size: 1.06rem; font-weight: 800; line-height: 1.25; }
.mtile .how { font-size: .88rem; color: var(--muted); }
.reminder { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: .9rem; font-weight: 600; }
.reminder[hidden] { display: none; }
.reminder svg.i { margin-top: 1px; }
.btnrow { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 800;
  background: var(--accent); color: var(--accent-ink); border: 0; text-decoration: none; }
.btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn svg.i { width: 18px; height: 18px; }

/* 3-step flow strip */
.flow { display: flex; align-items: stretch; gap: 4px; margin: 0 0 12px; }
.flow .fs { flex: 1; min-width: 0; text-align: center; padding: 8px 4px; border-radius: 12px; background: var(--surface-2); font-size: .8rem; font-weight: 700; line-height: 1.25; }
.flow .fs small { display: block; font-weight: 600; color: var(--muted); font-size: .72rem; }
.flow .fs.on { background: var(--accent); color: var(--accent-ink); }
.flow .fs.on small { color: inherit; opacity: .85; }
.flow .arr { flex: none; align-self: center; width: 16px; height: 16px; color: var(--muted); background: none; padding: 0; }
.flow { padding: 0; }

.link { background: none; border: 0; padding: 0; font-weight: 800; text-align: left; color: inherit; text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--accent); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.stat { padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; border-radius: 6px; width: fit-content; }
.stat span { font-size: .76rem; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* week */
.week { display: grid; gap: 8px; }
.day { padding: 8px 14px; display: grid; grid-template-columns: 52px 1fr; gap: 0 8px; }
.day > .dname { grid-row: span 2; padding-top: 10px; font-weight: 800; font-size: .95rem; }
.day > .dname small { display: block; font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.day.is-today { border: 2px solid var(--accent); }
.meal { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; min-width: 0; }
.meal + .meal { border-top: 1px dashed var(--border); }
.meal .when { font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); width: 64px; flex: none; padding-top: 4px; font-weight: 700; }
.meal .what { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
@media (max-width: 420px) { .meal { flex-direction: column; gap: 2px; } .meal .when { width: auto; padding-top: 0; } }
.callout { background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; margin-top: 10px; font-size: .9rem; }
.callout ul { margin: 0; padding-left: 18px; }

/* ---------- Checklists */
.progress { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: .86rem; color: var(--muted); font-weight: 700; }
.count { font-variant-numeric: tabular-nums; min-width: 3.2em; }
.bar { flex: 1; height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .3s; }
.reset { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: .8rem; color: var(--muted); font-weight: 700; }
.list { overflow: hidden; }
.row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; cursor: pointer; min-height: 52px; position: relative; }
.row + .row { border-top: 1px solid var(--border); }
.row input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin: 0; flex: none; cursor: pointer;
  border: 2px solid color-mix(in srgb, var(--muted) 70%, transparent); border-radius: 8px; background: var(--surface); display: grid; place-content: center; transition: background .15s, border-color .15s; }
.row input[type=checkbox]::before { content: ""; width: 12px; height: 7px; border: solid var(--surface); border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
.row input[type=checkbox]:checked { background: var(--ok); border-color: var(--ok); }
.row input[type=checkbox]:checked::before { opacity: 1; }
.row .body { flex: 1; min-width: 0; }
.row.done .body, .row.done .price, .row.have .body, .row.have .price { opacity: .5; }
.row.done .nm { text-decoration: line-through; text-decoration-thickness: 2px; }
.row:hover { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }

/* prep timeline */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prep .row { padding-left: 18px; }
.prep .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.rowhead { display: inline-flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.time { font-variant-numeric: tabular-nums; font-weight: 800; font-size: .9rem; }
.step-text { display: block; margin-top: 3px; font-size: .94rem; }
.act { font-weight: 800; }
.badge { display: none; font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; }
.badge.upnext { background: var(--mustard); color: var(--mustard-ink); }
.badge.nowb { background: var(--accent); color: var(--accent-ink); }
.prep .row.next { background: color-mix(in srgb, var(--mustard-soft) 80%, transparent); }
.prep .row.next .upnext, .prep .row.now .nowb { display: inline-block; }
.prep .row.now { box-shadow: inset 0 0 0 2px var(--accent); }
.prep .row.next .step-text { font-weight: 600; font-size: 1rem; }
.prep .row.done { min-height: 0; padding-top: 8px; padding-bottom: 8px; align-items: center; }
.prep .row.done .body { display: flex; align-items: baseline; gap: 8px; }
.prep .row.done .chip, .prep .row.done .badge { display: none !important; }
.prep .row.optstep:not(.done) { background: repeating-linear-gradient(-45deg, transparent 0 8px, color-mix(in srgb, var(--surface-2) 70%, transparent) 8px 16px); }
.prep .row.optstep .step-text { font-size: .88rem; color: var(--muted); }
.prep .row.done .step-text { margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .88rem; }
.prep .row.done .nm { text-decoration: none; }
.done-msg { display: none; padding: 12px 14px; text-align: center; font-weight: 800; color: var(--ok); background: var(--ok-soft); border-radius: 14px; margin-top: 10px; }
.done-msg.show { display: block; }
.clock { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; margin-bottom: 10px; }
.clock .t { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.1rem; }
.clock .grow { flex: 1; min-width: 120px; font-size: .86rem; color: var(--muted); }
.kit { margin-bottom: 12px; }
.kit > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; min-height: 48px; cursor: pointer; }
.kit > summary::-webkit-details-marker { display: none; }
.kit > summary h3 { margin: 0; }
.kit[open] > summary .chev { transform: rotate(180deg); }
.kit ul { padding: 0 16px 12px !important; }
.kit ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .kit ul { grid-template-columns: 1fr; } }
.kit li { display: flex; gap: 8px; align-items: baseline; font-size: .92rem; }
.kit li::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); flex: none; transform: translateY(-2px); }
.kit li small { color: var(--muted); }
.warnbox { border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; background: var(--mustard-soft); border: 1px solid color-mix(in srgb, var(--mustard) 60%, var(--border)); }
.warnbox.strong { border-width: 2px; border-color: var(--accent); background: var(--accent-soft); }
.warnbox[hidden] { display: none; }
.warnbox ul { margin: 4px 0 0; padding-left: 18px; font-size: .9rem; }
.warnbox li[hidden] { display: none; }
.rules { margin: 0; padding: 12px 16px 12px 34px; }
.rules li { margin: 5px 0; }

/* ---------- Recipes */
.intro { display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin-bottom: 14px; background: var(--mustard-soft); border-color: color-mix(in srgb, var(--mustard) 50%, var(--border)); }
.intro svg.i { color: var(--accent); margin-top: 2px; }
.intro p { margin: 0; font-size: .92rem; }
.strip { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; overflow-x: auto; margin: 0 -16px 10px; padding: 2px 16px 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.strip::-webkit-scrollbar { display: none; }
.strip > * { flex: none; }
.strip .lbl { font-size: .78rem; font-weight: 800; color: var(--muted); padding-right: 2px; }
.strip button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: .86rem; font-weight: 700; }
.strip button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
details.card { margin-bottom: 10px; overflow: hidden; }
details > summary { list-style: none; padding: 14px; cursor: pointer; display: flex; gap: 12px; align-items: center; min-height: 64px; }
details > summary::-webkit-details-marker { display: none; }
details > summary:focus-visible { outline-offset: -3px; border-radius: 18px; }
.num { width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-content: center; font-weight: 800; font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); color: var(--c, var(--accent)); }
summary .title { flex: 1; min-width: 0; }
summary .title b { display: block; line-height: 1.25; font-size: 1.02rem; }
summary .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; align-items: center; font-size: .78rem; color: var(--muted); }
.pp { display: inline-flex; align-items: center; font-weight: 800; font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text); white-space: nowrap; line-height: 1.6; }
.pp.scaled { background: var(--mustard); color: var(--mustard-ink); }
.chev { width: 20px; height: 20px; flex: none; color: var(--muted); transition: transform .2s; }
details[open] > summary .chev { transform: rotate(180deg); }
.rbody { padding: 0 14px 16px; border-top: 1px dashed var(--border); }

.portion-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: 14px 0 4px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }

.rbody h4 { margin: 16px 0 6px; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--text); color: var(--bg);
  font-size: .8rem; font-weight: 800; display: grid; place-content: center; }

@media (max-width: 420px) { .facts { grid-template-columns: 1fr; } }
.note { font-size: .9rem; margin: 12px 0 0; padding: 10px 12px; border-left: 4px solid var(--mustard); background: color-mix(in srgb, var(--mustard-soft) 60%, transparent); border-radius: 0 10px 10px 0; }

/* ---------- Shopping + starter */

/* ---------- Sheet + toast */
dialog.sheet { border: 0; padding: 0; width: min(100%, 560px); max-width: 100%; margin: auto auto 0; border-radius: 22px 22px 0 0;
  background: var(--surface); color: var(--text); box-shadow: 0 -10px 40px rgb(0 0 0 / .35); max-height: 85vh; }

dialog.sheet::backdrop { background: rgb(20 10 5 / .55); }

.close { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); display: grid; place-content: center; flex: none; }
.toast { position: fixed; z-index: 40; left: 50%; transform: translate(-50%, 20px); bottom: calc(var(--navh) + 22px); width: min(calc(100% - 32px), 420px);
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 700; font-size: .9rem;

.miniclock { position: fixed; z-index: 29; left: 50%; transform: translateX(-50%); bottom: calc(var(--navh) + 18px); width: min(calc(100% - 20px), 520px);
  display: flex; align-items: center; gap: 10px; padding: 8px 14px; min-height: 48px; border-radius: 16px; border: 0; text-align: left;
  background: var(--text); color: var(--bg); box-shadow: 0 10px 30px -12px rgb(0 0 0 / .5); }

@media (min-width: 760px) {

<header class="site" id="siteHeader">
  <div class="wrap">

        <path d="M13 8c-2 2 2 4 0 7M20 7c-2 2 2 4 0 7M27 8c-2 2 2 4 0 7" stroke="var(--mustard)" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <button role="tab" id="tab-shop" aria-controls="shop" data-tab="shop" aria-selected="false">

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button type="button" id="toastBtn" hidden>Fortryd</button></div>

<script>
/*FMT*/
/*DATA*/

/* ---------- Data, with fallbacks for fields that may be missing */
const A = (x) => (Array.isArray(x) ? x : []);
['BASES', 'RECIPES', 'WEEK', 'REMINDERS', 'PREP', 'RULES', 'SHOP', 'PANTRY', 'STARTER', 'STORES', 'SCALE_NOTES', 'KIT'].forEach((k) => { DATA[k] = A(DATA[k]); });
DATA.STYLES = DATA.STYLES || {};
DATA.EAT = DATA.EAT || {};
const TABS = ['plan', 'recipes', 'shop', 'starter'];
const CODES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DA_DAY = { Sun: 'søndag', Mon: 'mandag', Tue: 'tirsdag', Wed: 'onsdag', Thu: 'torsdag', Fri: 'fredag', Sat: 'lørdag' };
const DAY_ALIASES = { man: 'Mon', tir: 'Tue', ons: 'Wed', tor: 'Thu', fre: 'Fri', lør: 'Sat', lor: 'Sat', søn: 'Sun', son: 'Sun',
  mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' };
const TRACK = { pot: 'Gryde', pan: 'Pande', air: 'Airfryer', you: 'Dig' };
const MEALS = DATA.WEEK.length * 2 || 10;
const R = Object.fromEntries(DATA.RECIPES.map((r, i) => [r.id, Object.assign({ num: i + 1 }, r)]));
const PT = DATA.PREP_TIME || {};
const tmin = (t) => { const m = /^(\d+):(\d\d)$/.exec(String(t || '').trim()); return m ? +m[1] * 60 + +m[2] : null; };
const PREP_MIN = (() => {
  if (Number.isFinite(PT.rutine)) return PT.rutine;
  const ts = DATA.PREP.map((s) => tmin(s.t)).filter((x) => x != null);
  return ts.length ? Math.round(Math.max(...ts) / 5) * 5 : 75;
})();
const FIRST_MIN = Number.isFinite(PT.foersteGang) ? PT.foersteGang : null;
const isOptStep = (s) => !!(s && (s.opt || /^nødplan/i.test(String(s.t || ''))));
const BOX_KIT = DATA.KIT.find((k) => /boks/i.test(k.n || '') && Number.isFinite(k.count));
const BOXES = BOX_KIT ? BOX_KIT.count : MEALS;
const STEP_MIN = DATA.PREP.map((s) => tmin(s.t));

/* ---------- State: load and validate */
const KEY = 'lazyprep:v1';
const ALLOWED_THEMES = ['auto', 'light', 'dark'];
let saved = {};
try { const x = JSON.parse(localStorage.getItem(KEY)); if (x && typeof x === 'object' && !Array.isArray(x)) saved = x; } catch (e) {}
const isObj = (x) => x && typeof x === 'object' && !Array.isArray(x);
function cleanScale(v) {
  const n = Number(v);
  if (v == null || v === '' || !Number.isFinite(n) || n <= 0) return 1;
  return Math.min(4, Math.max(0.5, Math.round(n * 2) / 2));
}
const state = {
  checks: {},
  scale: cleanScale(saved.scale),
  tab: TABS.includes(saved.tab) ? saved.tab : 'plan',
  theme: ALLOWED_THEMES.includes(saved.theme) ? saved.theme : 'auto',
  rf: {},
  lists: {},
  prepStart: null,
};
if (isObj(saved.checks)) Object.keys(saved.checks).forEach((k) => { if (saved.checks[k] && /^[a-z]:/.test(k)) state.checks[k] = 1; });
if (isObj(saved.rf)) Object.keys(saved.rf).forEach((k) => {
  const n = saved.rf[k];
  if (/^[rb]:/.test(k) && typeof n === 'number' && Number.isFinite(n) && n >= 0.5 && n <= 8) state.rf[k] = Math.round(n * 2) / 2;
});
const savedLists = isObj(saved.lists) ? saved.lists : {};
['shop', 'starter'].forEach((l) => {
  const s = isObj(savedLists[l]) ? savedLists[l] : {};
  state.lists[l] = {
    store: typeof s.store === 'string' ? s.store : 'all',
    hide: typeof s.hide === 'boolean' ? s.hide : true,
    first: typeof s.first === 'boolean' ? s.first : false,
  };
});
if (typeof saved.prepStart === 'number' && saved.prepStart > Date.now() - 2 * 864e5 && saved.prepStart <= Date.now()) state.prepStart = saved.prepStart;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

/* Item keys: by stable id when the item has one (shared across lists), else the old position key. */
const ikey = (it, legacy) => (it && it.id ? 'i:' + it.id : legacy);
const hkey = (k) => 'h:' + k.slice(2);
const migrate = (items, legacy) => items.forEach((it, i) => {
  const old = legacy(i), nk = ikey(it, old);
  if (nk !== old && state.checks[old]) { state.checks[nk] = 1; delete state.checks[old]; }
});
DATA.SHOP.forEach((g, gi) => migrate(A(g.items), (i) => `s:${gi}:${i}`));
DATA.STARTER.forEach((g, gi) => migrate(A(g.items), (i) => `k:${gi}:${i}`));
migrate(DATA.PANTRY, (i) => `b:${i}`);
/* "Har jeg" only for staples: pantry + starter sections that are not fresh/frozen food. item.staple overrides. */
const FRESH = /kød|ost|mejeri|grønt|frugt|frost|køl/i;
const HAVE_OK = new Set();
DATA.STARTER.forEach((g, gi) => A(g.items).forEach((it, i) => {
  const staple = it.staple != null ? !!it.staple : !FRESH.test(g.sec || '');
  if (staple) HAVE_OK.add(ikey(it, `k:${gi}:${i}`));
}));
DATA.PANTRY.forEach((it, i) => { if (it.staple !== false) HAVE_OK.add(ikey(it, `b:${i}`)); });

/* ---------- Helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const comma = (s) => String(s).replace(/(\d)\.(\d)/g, '$1,$2');
const fmtF = (f) => comma(f);
const FR = { 0.25: '¼', 0.5: '½', 0.75: '¾' };
const fracTxt = (f) => (FR[f % 1] ? (Math.floor(f) || '') + FR[f % 1] : fmtF(f));
const SING = { portioner: 'portion', bokse: 'boks', bægre: 'bæger', poser: 'pose', dåser: 'dåse', kopper: 'kop', skåle: 'skål', terninger: 'terning',
  breve: 'brev', pakker: 'pakke', tortillas: 'tortilla', skiver: 'skive', bundter: 'bundt', æsker: 'æske', flasker: 'flaske', bøtter: 'bøtte',
  måltider: 'måltid', personer: 'person', omgange: 'omgang', løg: 'løg', glas: 'glas', stk: 'stk',
  portions: 'portion', boxes: 'box', cups: 'cup', batches: 'batch', bags: 'bag', cans: 'can', jars: 'jar', cubes: 'cube', onions: 'onion' };
const ADJ1 = { små: 'lille', store: 'stor', ekstra: 'ekstra', small: 'small', big: 'big', large: 'large' };
/* fmtText + Danish decimal comma + "1 portioner" -> "1 portion" (also "1 små kopper" -> "1 lille kop"). */
const fmtT = (s, f) => comma(fmtText(String(s), f)).replace(/(^|[^\d.,¼½¾])1 (?:(små|store|ekstra|small|big|large) )?([a-zæøå]+)(?![a-zæøå])/gi,
  (m, a, adj, w) => (SING[w.toLowerCase()] ? `${a}1 ${adj ? ADJ1[adj.toLowerCase()] + ' ' : ''}${SING[w.toLowerCase()]}` : m));
const fmtQ = (q, u, f) => comma(fmtQty(q, u, f));

/* Set text; flash it when it changes. Web Animations, so no forced reflow while dragging the slider. */
let ready = false, flashColors = null;
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function setText(el, t) {
  if (!el) return;
  t = String(t);
  if (el.textContent === t) return;
  const had = ready && el.textContent !== '';
  el.textContent = t;
  if (had && flashColors && el.animate && el.offsetParent !== null) {
    el.animate([{ backgroundColor: flashColors[0], color: flashColors[1] }, { backgroundColor: 'transparent' }], { duration: 650, easing: 'ease-out' });
  }
}

/* ---------- Day logic */
function todayCode() {
  let q = null;
  try { q = new URLSearchParams(location.search).get('day'); } catch (e) {}
  if (q) {
    const k = q.trim().toLowerCase();
    const full = Object.keys(DA_DAY).find((c) => DA_DAY[c] === k);
    const hit = full || DAY_ALIASES[k.slice(0, 3)];
    if (hit) return hit;
  }
  return CODES[new Date().getDay()];
}
const TODAY = todayCode();
const weekIdx = (c) => ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].indexOf(c);
const dayName = (d) => (d && d.name ? String(d.name) : DA_DAY[d && d.day ? d.day : d] || String(d && d.day || d));
const lc = (s) => String(s).toLowerCase();
/* fridge | freezer | thawed */
/* Box state for TODAY. later = Saturday, nothing cooked yet. A box with thaw 'Tue' moves Tuesday evening:
   Tuesday daytime it is still frozen (tonight), from Wednesday it is thawed. Sunday counts as the evening before Monday. */
const THAW_ORDER = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
function boxState(m) {
  if (TODAY === 'Sat') return 'later';
  if (!m || m.s !== 'freezer') return 'fridge';
  const ti = THAW_ORDER.indexOf(TODAY), th = THAW_ORDER.indexOf(m.thaw);
  if (th >= 0) { if (ti > th) return 'thawed'; if (ti === th) return 'tonight'; }
  return 'freezer';
}
const CHIP = { fridge: '<span class="chip fridge">Køl</span>', freezer: '<span class="chip frozen">Fryser</span>', tonight: '<span class="chip frozen">Fryser, flyt i aften</span>',
  thawed: '<span class="chip thawed">Optøet, i køl</span>', later: '<span class="chip">Laves søndag</span>' };
const stateChip = (m) => CHIP[boxState(m)];
const eatOf = (id) => DATA.EAT[id] || (R[id] && R[id].reheat) || '';

/* ---------- Scaling */
function usedLabel(it, f) {
  if (!it.u || it.need == null) return '';
  const v = it.need * f;
  if (it.u === 'stk') return `bruger ${Math.ceil(v)} stk`;
  if ((it.u === 'g' || it.u === 'ml') && v >= 1000) return `bruger ca. ${fmtF(Math.round(v / 100) / 10)} ${it.u === 'g' ? 'kg' : 'L'}`;
  return `bruger ca. ${Math.round(v / 10) * 10 || Math.round(v)} ${it.u}`;
}
/* "2 breve" for count packs, "2 × 400 g" for weight packs. */
function packLabel(it, n) {
  if (n <= 1) return it.label || (it.unit ? '1 ' + it.unit : '');
  if (it.unit) return `${n} ${it.plural || it.unit}`;
  return `${n} × ${it.label || ''}`;
}
const priceOf = (it, f) => (it.need != null && it.size ? packs(it, f) * (it.price || 0) : it.price || 0);
const cardF = (key) => (state.rf[key] != null ? state.rf[key] : state.scale);

function updateCard(card) {
  const key = card.dataset.card, f = cardF(key), base = card.dataset.kind === 'base';
  const custom = state.rf[key] != null;
  const p = 2 * f;
  const label = base ? `x${fmtF(f)}` : `${fracTxt(p)} portion${p === 1 ? '' : 'er'}`;
  setText($('.pout', card), label);
  const pp = $('.pp', card);
  setText(pp, label);
  pp.classList.toggle('scaled', f !== 1);
  const sf = $('.scaled-for', card);
  setText(sf, base ? (f === 1 ? 'normal mængde' : `ganget med ${fmtF(f)}`) : `til ${label}`);
  sf.classList.toggle('on', f !== 1);
  const [minus, plus] = $$('[data-step]', card);
  minus.setAttribute('aria-disabled', f <= 0.5);
  plus.setAttribute('aria-disabled', f >= 8);
  const sync = $('.sync', card);
  sync.classList.toggle('custom', custom);
  $('.sync-txt', sync).textContent = custom ? 'Kun denne ret' : 'Følger slideren';
  $('[data-sync]', sync).hidden = !custom;
  $$('[data-q]', card).forEach((el) => setText(el, fmtQ(parseFloat(el.dataset.q), el.dataset.u, f)));
  $$('[data-raw]', card).forEach((el) => setText(el, fmtT(el.dataset.raw, f)));
}

function update() {
  const f = state.scale;
  try { const cs = getComputedStyle(document.documentElement); flashColors = [cs.getPropertyValue('--mustard').trim(), cs.getPropertyValue('--mustard-ink').trim()]; } catch (e) {}
  if (reduceMotion()) flashColors = null;
  const sl = $('#scale');
  sl.value = f;
  sl.style.setProperty('--fill', ((f - 0.5) / 3.5 * 100) + '%');
  sl.setAttribute('aria-valuetext', `${people(f)}, ${comma(MEALS * f)} måltider`);
  const out = $('#scaleOut');
  if (!out.firstChild) out.innerHTML = '<b></b><em></em>';
  setText($('b', out), `${comma(MEALS * f)} måltider`);
  setText($('em', out), people(f));
  setText($('#tagline'), `${comma(MEALS * f)} måltider · ${timeTxt(f)} · ingen ovn`);
  $$('[data-raw]').forEach((el) => { if (!el.closest('[data-card]')) setText(el, fmtT(el.dataset.raw, f)); });
  $$('[data-meals]').forEach((el) => setText(el, comma(MEALS * f)));
  $$('[data-boxes]').forEach((el) => setText(el, Math.ceil(BOXES * f)));
  $$('[data-kc]').forEach((el) => {
    const c = Math.max(1, Math.ceil(parseFloat(el.dataset.kc) * f - 1e-9));
    setText(el, c);
    const nm = el.nextElementSibling, w = String(c > 1 ? nm.dataset.kpl : nm.dataset.kn);
    const low = w.charAt(0).toLowerCase() + w.slice(1);
    nm.textContent = c === 1 ? fmtT('1 ' + low, 1).slice(2) : low;
  });
  $$('[data-card]').forEach(updateCard);
  setText($('#statMeals'), comma(MEALS * f));
  setText($('#statTime'), timeTxt(f));
  setText($('#prepTimeTxt'), `${timeTxt(f).replace(/^ca\./, 'Ca.')}${FIRST_MIN && f <= 1 ? ` (første gang ca. ${FIRST_MIN} min)` : ''}`);
  const wl = $('#weekendLine');
  if (wl) setText(wl, `${timeTxt(f).replace(/^ca\./, 'Ca.')} i dag giver dig ${comma(MEALS * f)} måltider. Sæt en podcast på.`);
  $('#halfNote').hidden = f >= 1;
  let anyNote = false;
  $$('#scaleNotes [data-min]').forEach((el) => { el.hidden = f < parseFloat(el.dataset.min); if (!el.hidden) anyNote = true; });
  $('#scaleNotes').hidden = !anyNote;
  $('#scaleNotes').classList.toggle('strong', f >= 2);

  const all = [...LIST_ROWS.shop, ...LIST_ROWS.starter];
  all.forEach(({ it, ri }) => {
    const n = it.need != null && it.size ? packs(it, f) : 1;
    setText($(`[data-pack="${ri}"]`), it.need != null && it.size ? packLabel(it, n) + (it.u ? ` (${usedLabel(it, f)})` : '') : (it.label || ''));
    setText($(`[data-price="${ri}"]`), priceOf(it, f) + ' kr');
  });
  totals();
}

function totals() {
  const f = state.scale;
  let per = 0;
  ['shop', 'starter'].forEach((list) => {
    let total = 0, withOpt = 0, left = 0, done = 0, count = 0;
    const seen = new Set();
    LIST_ROWS[list].forEach(({ key, it, pantry }) => {
      if (pantry && !state.lists.shop.first) return;
      if (seen.has(key)) return;
      seen.add(key);
      const price = priceOf(it, f);
      const isDone = !!state.checks[key] || !!state.checks[hkey(key)];
      count++;
      if (isDone) done++;
      withOpt += price;
      if (!it.opt) { total += price; if (!isDone) left += price; }
    });
    setText($(`#${list}Total`), `ca. ${total} kr`);
    setText($(`#${list}Opt`), `med valgfrie: ${withOpt} kr`);
    setText($(`#${list}Left`), `${left} kr`);
    $(`#${list}Count`).textContent = `${done}/${count}`;
    $(`#${list}Count2`).textContent = `${done}/${count}`;
    $(`#${list}Bar`).style.width = (count ? 100 * done / count : 0) + '%';
    if (list === 'shop') {
      let weekly = 0;
      DATA.SHOP.forEach((g) => A(g.items).forEach((it) => { if (!it.opt) weekly += priceOf(it, f); }));
      per = Math.round(weekly / (MEALS * f));
    }
  });
  setText($('#statPer'), `${per} kr`);
  prepCounters();
}

function syncRows() {
  $$('[data-key-row]').forEach((r) => {
    const k = r.dataset.keyRow, done = !!state.checks[k], have = !!state.checks[hkey(k)];
    const cb = $('input[data-key]', r);
    cb.checked = done;
    r.classList.toggle('done', done);
    r.classList.toggle('have', have && !done);
    const hb = $('[data-have]', r);
    if (hb) { hb.setAttribute('aria-pressed', have); hb.textContent = have ? 'Har jeg' : 'Har jeg?'; }
  });
  $$('#prepList .row').forEach((r) => {
    const cb = $('input', r);
    cb.checked = !!state.checks[cb.dataset.key];
    r.classList.toggle('done', cb.checked);
  });
}

function applyListTools() {
  ['shop', 'starter'].forEach((list) => {
    const sec = $('#' + list), cfg = state.lists[list];
    const valid = $$('[data-store]', sec).map((b) => b.dataset.store);
    if (!valid.includes(cfg.store)) cfg.store = 'all';
    $$('[data-store]', sec).forEach((b) => b.setAttribute('aria-pressed', b.dataset.store === cfg.store));
    const hide = $('[data-hide]', sec);
    if (hide) hide.checked = cfg.hide;
    const first = $('[data-first]', sec);
    if (first) first.checked = cfg.first;
    const cl = $('.checklist', sec);
    cl.classList.toggle('hide-done', cfg.hide);
    const pg = $('[data-pantry]', sec);
    if (pg) pg.classList.toggle('off', !cfg.first);
    const s = lc(cfg.store), notIn = [];
    $$('.row[data-key-row]', cl).forEach((r) => {
      r.classList.toggle('gone', r.classList.contains('done') || r.classList.contains('have'));
      const w = lc(r.dataset.where);
      const out = s !== 'all' && w !== '' && !(w.includes(s) || w.includes('alle'));
      r.classList.toggle('filtered-out', out);
      const inPantryOff = pg && pg.contains(r) && !cfg.first;
      if (out && !inPantryOff && !r.classList.contains('done') && !r.classList.contains('have')) {
        const row = LIST_ROWS[list].find((x) => x.key === r.dataset.keyRow);
        if (row) notIn.push(`${row.it.n} (${row.it.where}${row.it.alt ? ', ellers ' + row.it.alt : ''})`);
      }
    });
    let visible = 0;
    $$('.grp', cl).forEach((g) => {
      const v = $$('.row', g).filter((r) => !r.classList.contains('filtered-out') && !(cfg.hide && r.classList.contains('gone'))).length;
      g.classList.toggle('empty', v === 0);
      if (!g.classList.contains('off')) visible += v;
    });
    /* Required = not optional, not bought, not "Har jeg", inside the current scope (basics only when folded in). */
    const scope = $$('.grp:not(.off) .row[data-key-row]', cl);
    const rowOf = (r) => LIST_ROWS[list].find((x) => x.key === r.dataset.keyRow);
    const req = scope.filter((r) => { const x = rowOf(r); return x && !x.it.opt && !r.classList.contains('gone'); });
    const reqHere = req.filter((r) => !r.classList.contains('filtered-out'));
    const reqElse = req.filter((r) => r.classList.contains('filtered-out'));
    const inStore = scope.filter((r) => !r.classList.contains('filtered-out')).length;
    const ab = $(`[data-allbought="${list}"]`);
    const storeName = s === 'all' ? '' : (($(`[data-store="${CSS.escape(cfg.store)}"]`, sec) || {}).textContent || cfg.store);
    const missing = [...new Set(reqElse.map((r) => { const x = rowOf(r).it; return `${x.n} (${x.where || 'andet sted'}${x.alt ? ', ellers ' + x.alt : ''})`; }))];
    const showAb = inStore > 0 && reqHere.length === 0;
    ab.classList.toggle('show', showAb);
    ab.classList.toggle('partial', showAb && missing.length > 0);
    if (showAb) ab.innerHTML = missing.length ? `<b>Alt fra ${esc(storeName)} er købt.</b> Mangler stadig: ${missing.map(esc).join(', ')}` : esc(ab.dataset.done);
    const ni = $(`[data-notin="${list}"]`);
    ni.hidden = !notIn.length || showAb;
    ni.innerHTML = notIn.length ? `<b>Ikke i denne butik:</b> ${notIn.map(esc).join(', ')}` : '';
  });
}

/* ---------- Prep progress + clock */
function prepCounters() {
  const boxes = $$('#prepList input[data-key]:not([data-opt])');
  const done = boxes.filter((b) => b.checked).length;
  $('#prepCount').textContent = `${done}/${boxes.length}`;
  $('#prepBar').style.width = (boxes.length ? 100 * done / boxes.length : 0) + '%';
  $$('#prepList .row').forEach((r) => r.classList.remove('next'));
  const next = boxes.find((b) => !b.checked);
  if (next) next.closest('.row').classList.add('next');
  $('#prepDone').classList.toggle('show', boxes.length > 0 && done === boxes.length);
  tickClock();
}
const hm = (d) => `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
function tickClock() {
  const btn = $('#clockBtn');
  if (!btn) return;
  const run = state.prepStart != null;
  btn.innerHTML = run ? 'Stop' : ICON.play + 'Start prep';
  btn.classList.toggle('ghost', run);
  let nowI = -1, behind = 0, nextTxt = '';
  const mc = $('#miniClock');
  if (run) {
    const ratio = timeMin(state.scale) / PREP_MIN;
    const sec = Math.max(0, Math.floor((Date.now() - state.prepStart) / 1000));
    const m = Math.floor(sec / 60);
    const tt = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    $('#clockT').textContent = tt;
    STEP_MIN.forEach((t, i) => { if (t != null && t * ratio <= m) nowI = i; });
    const nb = $('#prepList .row.next');
    if (nb) { const s = DATA.PREP[+nb.dataset.i]; nextTxt = `${s.a ? s.a + ' ' : ''}${fmtT(s.x, state.scale)}`; }
    /* Behind = how late the first unticked step with a clock time is. */
    const firstTimed = $$('#prepList input[data-key]:not([data-opt])').map((b) => +b.closest('.row').dataset.i).find((i) => STEP_MIN[i] != null && !state.checks['p:' + i]);
    if (firstTimed != null) behind = Math.floor(m - STEP_MIN[firstTimed] * ratio);
    const end = hm(new Date(state.prepStart + timeMin(state.scale) * 60000));
    $('#clockNote').textContent = (nowI >= 0 ? `Nu: trin ${nowI + 1} (${DATA.PREP[nowI].t}). ` : 'Lige startet. ') + `Færdig ca. kl. ${end}.` +
      (behind > 3 ? ` Du er ca. ${behind} min bagud, bare fortsæt i rækkefølge.` : '');
    if (mc) {
      $('#mcT').textContent = tt;
      $('#mcNext').textContent = nextTxt ? `Næste: ${nextTxt}` : 'Alt er gjort';
      $('#mcBehind').textContent = behind > 3 ? `Ca. ${behind} min bagud, bare fortsæt i rækkefølge.` : '';
      $('#mcBehind').hidden = !(behind > 3);
      const r = $('#clockCard').getBoundingClientRect();
      mc.hidden = !(state.tab === 'plan' && (r.bottom < 0 || r.top > innerHeight));
    }
  } else {
    $('#clockT').textContent = '';
    $('#clockNote').textContent = 'Uret viser, hvor langt du burde være nået.';
    if (mc) mc.hidden = true;
  }
  $$('#prepList .row').forEach((r, i) => r.classList.toggle('now', i === nowI));
}
function startClock() {
  state.prepStart = Date.now();
  const k = $('#kitBox'); if (k) k.open = false;
  save(); clockLoop(); tickClock();
}
let clockTimer = null;
function clockLoop() {
  clearInterval(clockTimer);
  if (state.prepStart != null) clockTimer = setInterval(() => { if (!document.hidden) tickClock(); }, 1000);
}

/* ---------- Toast with undo */
let toastT = null, undoFn = null;
function toast(msg, undo) {
  undoFn = undo || null;
  $('#toastTxt').textContent = msg;
  $('#toastBtn').hidden = !undo;
  $('#toast').classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => { $('#toast').classList.remove('show'); undoFn = null; }, 6000);
}

/* ---------- Tabs, theme, header */
function showTab(tab) {
  if (!TABS.includes(tab)) tab = 'plan';
  state.tab = tab;
  $$('nav.tabs button').forEach((b) => {
    const on = b.dataset.tab === tab;
    b.setAttribute('aria-selected', on);
    b.tabIndex = on ? 0 : -1;
  });
  $$('main > section').forEach((s) => { s.hidden = s.id !== tab; });
  document.body.classList.remove('hdr-hidden');
  save();
  requestAnimationFrame(onScroll);
}
function applyTheme() {
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = state.theme;
  const name = { auto: 'Auto', light: 'Lys', dark: 'Mørk' }[state.theme];
  const b = $('#theme');
  b.innerHTML = (ICON[state.theme] || ICON.auto) + `<span class="lbl">${name}</span>`;
  b.setAttribute('aria-label', `Farvetema: ${name}. Tryk for at skifte`);
  let dark = state.theme === 'dark';
  try { if (state.theme === 'auto') dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
  $('meta[name="theme-color"]').setAttribute('content', dark ? '#16110d' : '#fbf3e8');
  if (ready) update();
}
function measureHeader() {
  document.documentElement.style.setProperty('--hh', $('#siteHeader').offsetHeight + 'px');
}
/* Hide the header on scroll down, show on scroll up. Sticky totals collapse to one line once stuck.
   Collapsing keeps the same layout height (negative margin), so nothing below jumps. */
let lastY = 0, scrollQueued = false, holdHeader = 0;
function onScroll() {
  scrollQueued = false;
  const y = window.scrollY;
  const hdr = $('#siteHeader');
  const busy = hdr.contains(document.activeElement) || $('#sheet').open || Date.now() < holdHeader;
  if (y > lastY + 6 && y > 140 && !busy) document.body.classList.add('hdr-hidden');
  else if (y < lastY - 6 || y < 140) document.body.classList.remove('hdr-hidden');
  lastY = y;
  const topPx = document.body.classList.contains('hdr-hidden') ? 8 : hdr.offsetHeight + 8;
  $$('.sticky-sum').forEach((s) => {
    if (s.offsetParent === null) return;
    const anchor = s.previousElementSibling;
    const stuck = anchor.getBoundingClientRect().top < topPx - 4;
    if (stuck === s.classList.contains('stuck')) return;
    if (stuck) {
      const full = s.offsetHeight;
      s.classList.add('stuck');
      s.style.marginBottom = (12 + full - s.offsetHeight) + 'px';
    } else {
      s.classList.remove('stuck');
      s.style.marginBottom = '';
    }
  });
}
window.addEventListener('scroll', () => { if (!scrollQueued) { scrollQueued = true; requestAnimationFrame(onScroll); } }, { passive: true });

/* ---------- Boot */
renderPlan(); renderRecipes(); renderShop(); renderStarter();
applyTheme(); showTab(state.tab); syncRows(); update(); applyListTools(); measureHeader(); clockLoop();
ready = true;
save();
window.addEventListener('resize', measureHeader);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}

/* ---------- Events */
$('#scale').addEventListener('input', (e) => {
  state.scale = cleanScale(e.target.value);
  Object.keys(state.rf).forEach((k) => { if (state.rf[k] === state.scale) delete state.rf[k]; });
  update(); save();
});
$('#theme').addEventListener('click', () => {
  state.theme = { auto: 'light', light: 'dark', dark: 'auto' }[state.theme];
  applyTheme(); save();
});
const tabs = $$('nav.tabs button');
tabs.forEach((b, i) => {
  b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo(0, 0); });
  b.addEventListener('keydown', (e) => {
    let j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = tabs.length - 1;
    if (j == null) return;
    e.preventDefault();
    tabs[j].focus(); showTab(tabs[j].dataset.tab);
  });
});

document.addEventListener('change', (e) => {
  const t = e.target;
  const sec = t.closest('section');
  if (t.matches('[data-hide]')) { state.lists[sec.id].hide = t.checked; applyListTools(); save(); return; }
  if (t.matches('[data-first]')) { state.lists.shop.first = t.checked; applyListTools(); totals(); save(); return; }
  const k = t.dataset && t.dataset.key;
  if (!k) return;
  if (t.checked) state.checks[k] = 1; else delete state.checks[k];
  save();
  syncRows();
  if (k.startsWith('p:')) {
    prepCounters();
    if (t.checked) {
      const next = $('#prepList .row.next');
      if (next) {
        const r = next.getBoundingClientRect();
        if (r.top < 0 || r.bottom > innerHeight - 90) next.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' });
      }
    }
  } else { totals(); setTimeout(applyListTools, cfgHideDelay()); }
});
/* Give a ticked row a beat before it disappears, so you see it was ticked. */
const cfgHideDelay = () => (reduceMotion() ? 0 : 350);

function resetList(list) {
  const before = Object.assign({}, state.checks), prevStart = state.prepStart;
  if (list === 'prep') {
    Object.keys(state.checks).forEach((k) => { if (k.startsWith('p:')) delete state.checks[k]; });
    state.prepStart = null; clockLoop();
  } else {
    LIST_ROWS[list].forEach(({ key }) => { delete state.checks[key]; });
  }
  save(); syncRows(); totals(); applyListTools();
  toast('Flueben nulstillet', () => { state.checks = before; state.prepStart = prevStart; clockLoop(); save(); syncRows(); totals(); applyListTools(); });
}

document.addEventListener('click', (e) => {
  const t = e.target;
  const step = t.closest('[data-step]');
  if (step) {
    if (step.getAttribute('aria-disabled') === 'true') return;
    const card = step.closest('[data-card]'), key = card.dataset.card;
    const f = Math.min(8, Math.max(0.5, cardF(key) + 0.5 * parseInt(step.dataset.step, 10)));
    if (f === state.scale) delete state.rf[key]; else state.rf[key] = f;
    updateCard(card); save();
    return;
  }
  const sync = t.closest('[data-sync]');
  if (sync) { const card = sync.closest('[data-card]'); delete state.rf[card.dataset.card]; updateCard(card); save(); $('[data-step="1"]', card).focus(); return; }
  const have = t.closest('[data-have]');
  if (have) {
    e.preventDefault();
    const hk = hkey(have.dataset.have);
    if (state.checks[hk]) delete state.checks[hk]; else state.checks[hk] = 1;
    save(); syncRows(); totals(); setTimeout(applyListTools, cfgHideDelay());
    return;
  }
  const st = t.closest('[data-store]');
  if (st) { state.lists[st.closest('section').id].store = st.dataset.store; applyListTools(); save(); return; }
  const reset = t.closest('[data-reset]');
  if (reset) { resetList(reset.dataset.reset); return; }
  if (t.closest('#toastBtn')) { if (undoFn) undoFn(); undoFn = null; $('#toast').classList.remove('show'); return; }
  if (t.closest('#clockBtn')) {
    if (state.prepStart == null) startClock(); else { state.prepStart = null; save(); clockLoop(); tickClock(); }
    return;
  }
  if (t.closest('#miniClock')) { const n = $('#prepList .row.next') || $('#clockCard'); n.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' }); return; }
  const sp = t.closest('[data-start-prep]');
  if (sp && state.prepStart == null) startClock();
  const tg = t.closest('[data-tab-go]');
  if (tg) { showTab(tg.dataset.tabGo); window.scrollTo(0, 0); return; }
  const eat = t.closest('[data-eat]');
  if (eat) { e.preventDefault(); openEat(eat.dataset.eat, eat.dataset.st); return; }
  if (t.closest('[data-close]')) { $('#sheet').close(); return; }
  const go = t.closest('[data-goto]');
  if (go) { if ($('#sheet').open) $('#sheet').close(); gotoRecipe(go.dataset.goto); return; }
  if (t === $('#sheet')) { $('#sheet').close(); return; }
  const fb = t.closest('[data-filter]');
  if (fb) setFilter(fb.dataset.filter);
});

function setFilter(f) {
  $$('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.filter === f));
  $$('#recipes details').forEach((d) => { d.hidden = !(f === 'all' || d.dataset.style === f); });
  $$('.base-h').forEach((el) => { el.hidden = !(f === 'all' || f === 'base'); });
}
</script>
